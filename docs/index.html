<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="EduSolveMN">
<title>EduSolveMN · Ангийн самбар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F6FA;font-family:Inter,system-ui,sans-serif;color:#1A1F36;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;font-size:16px}
button{cursor:pointer}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:#1E2A5A;color:#fff;padding:20px 20px 16px}
header .sub{font-size:13px;color:#C9D1F0}
header .ttl{font-size:24px;font-weight:700;margin-top:2px}
main{flex:1;padding:18px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid #E1E4EE;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:20px}
h2{margin:0;font-size:16px}
.muted{color:#5A6178;font-size:13px;line-height:1.5}
label{font-size:14px;font-weight:600}
select,input[type=password],input[type=text]{height:50px;border:1px solid #C5CADB;border-radius:10px;padding:0 12px;background:#fff;color:#1A1F36;width:100%}
.btn{height:50px;border:0;border-radius:12px;background:#2747B8;color:#fff;font-weight:600;font-size:16px;width:100%}
.btn.sec{background:#fff;color:#2747B8;border:1.5px solid #2747B8}
.btn.dark{background:#1E2A5A}
.btn:disabled{opacity:.55}
.link{background:none;border:0;color:#2747B8;font-weight:600;padding:8px 0;align-self:flex-start;min-height:44px}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.p-red{background:#FDECEA;color:#A12A1E}.p-green{background:#E3F4EA;color:#1C6B40}.p-blue{background:#EEF1FA;color:#2747B8}.p-amber{background:#FFF3E5;color:#8A4B0B}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.topic{text-align:left;background:#fff;border:1.5px solid #E1E4EE;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;width:100%;color:#1A1F36}
.topic.now{border-color:#2747B8}
.locked{background:#F0F2F7}
.err{color:#B42318;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumbs img{width:100%;height:76px;object-fit:cover;border-radius:8px;border:1px solid #C5CADB}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.strip .ph{position:relative;flex:0 0 auto;width:120px;height:150px;border-radius:10px;overflow:hidden;border:1px solid #C5CADB;background:#EEF1FA;scroll-snap-align:start}
.strip .ph img{width:100%;height:100%;object-fit:cover;display:block}
.strip .ph .x{position:absolute;right:4px;top:4px;min-width:34px;height:34px;border-radius:99px;border:0;background:rgba(26,31,54,.8);color:#fff;font-size:15px;font-weight:700;padding:0 10px}
.strip .ph .x.sure{background:#B42318}
.strip .ph .no{position:absolute;left:6px;bottom:6px;background:rgba(26,31,54,.8);color:#fff;font-size:12px;border-radius:99px;padding:1px 8px}
textarea{width:100%;min-height:90px;border:1.5px solid #C5CADB;border-radius:10px;padding:10px;font:inherit;box-sizing:border-box}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{height:50px;border-radius:10px;border:1.5px solid #C5CADB;background:#fff;font-weight:600;color:#1A1F36}
.choice button.on{background:#B42318;border-color:#B42318;color:#fff}
.choice button.on2{background:#1E2A5A;border-color:#1E2A5A;color:#fff}
.opt{text-align:left;min-height:46px;padding:10px 12px;border-radius:10px;border:1.5px solid #D5DAE8;background:#fff;color:#1A1F36;width:100%}
.opt.on{border-color:#2747B8;background:#EEF1FA}
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bar{height:10px;border-radius:99px;background:#EEF1FA;overflow:hidden}.bar>div{height:10px;background:#2747B8}
.faces{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1A1F36;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:9;max-width:90%}
.ttimer{position:sticky;top:0;z-index:6;background:#1E2A5A;color:#fff;font-weight:800;text-align:center;border-radius:12px;padding:8px;font-size:16px}.ttimer.end{background:#B42318}.ttimer~.tbox{top:46px}
.tbox{background:#fff;border:1px solid #E1E4EE;border-radius:16px;overflow:hidden;position:sticky;top:0;z-index:5;box-shadow:0 6px 16px rgba(20,30,80,.12)}
.tbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #EEF1FA;font-size:13px}.tbar .muted{flex:1;font-size:12px}
.tbar button{border:1.5px solid #C5CADB;background:#fff;border-radius:99px;font-weight:700;font-size:13px;padding:6px 12px;color:#1A1F36}
.tpages{max-height:42vh;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:10px;background:#F4F6FB;-webkit-overflow-scrolling:touch}
.tbox.big .tpages{max-height:72vh}
.tpg{position:relative}.tpg span{position:absolute;left:8px;top:8px;background:rgba(26,31,54,.75);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px}
.tpg img{width:100%;display:block;border-radius:10px;border:1px solid #C5CADB;background:#fff;cursor:zoom-in}
.zov{position:fixed;inset:0;z-index:100;background:#111;display:flex;flex-direction:column}
.zbar{display:flex;gap:8px;padding:10px;padding-top:max(10px,env(safe-area-inset-top));background:#1A1F36}
.zbar button{height:44px;min-width:52px;border:0;border-radius:10px;background:#fff;font-size:20px;font-weight:800}.zbar #zx{margin-left:auto;font-size:15px;padding:0 14px}
.zsc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}.zsc img{width:100%;display:block;background:#fff}
@media(min-width:900px){.tpages{max-height:60vh}}
.xs{position:fixed;inset:0;z-index:90;background:#EEF1F7;display:flex;flex-direction:column;font-size:15px}
.xs-top{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:#1E2A5A;color:#fff}
.xs-top b{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.xs-top button{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:10px;height:36px;padding:0 10px;font-weight:700;font-size:13px}
.xs-tm{background:#fff;color:#1E2A5A;font-weight:800;border-radius:99px;padding:5px 10px;font-size:14px}.xs-tm.end{background:#B42318;color:#fff}
.xs-tabs{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;background:#fff;border-bottom:1px solid #E1E4EE;align-items:center}
.xs-tabs>button{flex:none;border:1.5px solid #C5CADB;background:#fff;border-radius:99px;height:34px;padding:0 12px;font-weight:700;font-size:13px;color:#1A1F36}
.xs-tabs>button.on{background:#1E2A5A;border-color:#1E2A5A;color:#fff}.xs-tabs>button.ok:not(.on){border-color:#1C7C4A;color:#1C7C4A}
.xs-z{margin-left:auto;display:flex;gap:4px;flex:none}.xs-z button{width:34px;height:34px;border-radius:9px;border:1.5px solid #C5CADB;background:#fff;font-size:18px;font-weight:800}
.xs-view{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;min-height:0}.xs-view>img{display:block;max-width:none}
.xs-draw{padding:12px;display:flex;flex-direction:column;gap:10px}.xs-tip{background:#FFF6E0;color:#7A4E00;border-radius:10px;padding:8px 10px;font-size:13px}
.xs-ph{display:flex;gap:8px;flex-wrap:wrap}.xs-ph>div{position:relative}.xs-ph img{width:96px;height:120px;object-fit:cover;border-radius:10px;border:1px solid #C5CADB}
.xs-ph>div button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:#B42318;color:#fff;font-weight:800}
.xs-cam{width:96px;height:120px;border:2px dashed #2747B8;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;color:#2747B8;font-size:13px;cursor:pointer;padding:6px}
.xs-ans{flex:0 0 auto;max-height:30vh;display:flex;flex-direction:column;background:#fff;border-top:2px solid #1E2A5A;box-shadow:0 -6px 16px rgba(20,30,80,.12)}
.xs-ah{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px}.xs-ah b{font-size:14px}.xs-ah span{color:#5B6478}
.xs-ah button{margin-left:auto;border:0;background:#2747B8;color:#fff;font-weight:800;border-radius:10px;height:36px;padding:0 16px}
.xs-ans .err{padding:0 10px;font-size:12.5px}
.xs-grid{overflow:auto;padding:4px 8px 10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;-webkit-overflow-scrolling:touch}
.xs-q{display:flex;align-items:center;gap:3px}.xs-q i{font-style:normal;font-weight:800;font-size:12.5px;width:22px;color:#5B6478}
.xs-q button{flex:1;min-width:0;height:30px;border-radius:7px;border:1px solid #D5DAE8;background:#fff;font-size:13px;font-weight:700;color:#1A1F36;padding:0}
.xs-q button.on{background:#2747B8;border-color:#2747B8;color:#fff}
@media(min-width:800px){.xs{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto auto 1fr}.xs-top,.xs-tabs{grid-column:1/-1}.xs-view{grid-column:1}.xs-ans{grid-column:2;max-height:none;border-top:0;border-left:2px solid #1E2A5A}.xs-grid{grid-template-columns:1fr}.xs-q button{height:36px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="sub" id="hSub">EduSolveMN</div>
    <div class="ttl" id="hTitle">Ангийн самбар</div>
    <div class="sub" id="hWho"></div>
  </header>
  <main id="app"><div class="muted">Ачаалж байна…</div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  var C = window.APP_CONFIG;
  var sb = window.supabase.createClient(C.url, C.key, { auth: { persistSession: false } });
  var app = document.getElementById('app');
  var params = new URLSearchParams(location.search);
  var cls = params.get('c') || localStorage.getItem('cls') || '';
  var preCode = params.get('s') || '';
  if (cls) { try { localStorage.setItem('cls', cls); } catch (e) {} }
  var token = null; try { token = localStorage.getItem('tok'); } catch (e) {}
  var home = null, curTopic = null, info = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3200); }
  function setHeader() {
    document.getElementById('hSub').textContent = info ? (info.school + ' · ' + info.subject) : 'EduSolveMN';
    var cn = home ? home['class'] : (info ? info['class'] : '');
    document.getElementById('hTitle').textContent = cn ? (cn + ' анги') : 'Ангийн самбар';
    document.getElementById('hWho').textContent = home ? (home.name + ' · ' + home.code) : '';
  }
  function fmtDate(d) { if (!d) return ''; var x = new Date(d); return (x.getMonth() + 1) + '/' + x.getDate(); }
  function logout() { try { localStorage.removeItem('tok'); } catch (e) {} token = null; home = null; showLogin(); }

  // ---------- LOGIN ----------
  function showLogin(msg) {
    setHeader();
    if (!cls) {
      app.innerHTML = '<div class="card"><h1>Ангийн линк хэрэгтэй</h1><div class="muted">Багшийн өгсөн QR кодыг уншуулж, эсвэл ангийн линкээр орно уу.</div></div>';
      return;
    }
    app.innerHTML = '<div class="card"><h1>Ангидаа нэвтрэх</h1><div class="muted">Кодоо сонгоод 4 оронтой тоогоо бичнэ үү.</div>' +
      '<label for="code">Миний код</label><select id="code"><option value="">Ачаалж байна…</option></select>' +
      '<label for="pin">4 оронтой тоо</label><div style="display:flex;gap:8px"><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" style="font-size:22px;letter-spacing:8px;flex:1;min-width:0"><button type="button" id="eye" aria-pressed="false" style="height:50px;padding:0 14px;border-radius:10px;border:1px solid #C5CADB;background:#fff;color:#1A1F36;font-weight:600">Харах</button></div>' +
      '<div class="err" id="err">' + esc(msg || '') + '</div><button class="btn" id="go">Орох</button>' +
      '<div class="muted">Кодоо мартсан бол багшаасаа асуугаарай.</div></div>';
    sb.rpc('class_codes', { p_class: cls }).then(function (r) {
      var sel = document.getElementById('code'); if (!sel) return;
      var list = r.data || [];
      sel.innerHTML = '<option value="">Кодоо сонгоно уу</option>' + list.map(function (c) { return '<option' + (c === preCode ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('');
      if (!list.length) sel.innerHTML = '<option value="">Энэ ангид сурагч бүртгэгдээгүй</option>';
    });
    var pin = document.getElementById('pin');
    document.getElementById('eye').onclick = function () { var show = pin.type === 'password'; pin.type = show ? 'text' : 'password'; this.textContent = show ? 'Нуух' : 'Харах'; this.setAttribute('aria-pressed', show); };
    pin.addEventListener('input', function () { pin.value = pin.value.replace(/\D/g, '').slice(0, 4); });
    document.getElementById('go').onclick = function () {
      var code = document.getElementById('code').value, p = pin.value, err = document.getElementById('err');
      if (!code) { err.textContent = 'Кодоо сонгоно уу.'; return; }
      if (p.length !== 4) { err.textContent = '4 оронтой тоо бичнэ үү.'; return; }
      this.disabled = true;
      var b = this;
      sb.rpc('student_login', { p_code: code, p_pin: p, p_class: cls }).then(function (r) {
        b.disabled = false;
        var d = r.data || {};
        if (d.token) { token = d.token; try { localStorage.setItem('tok', token); } catch (e) {} loadHome(); }
        else if (d.error === 'locked') err.textContent = 'Олон удаа буруу бичсэн. 15 минутын дараа дахин оролдоно уу.';
        else err.textContent = 'Код эсвэл тоо буруу байна.';
      });
    };
  }

  // ---------- HOME ----------
  function loadHome(after) {
    sb.rpc('student_home', { p_token: token }).then(function (r) {
      if (r.error) { logout(); return; }
      home = r.data; setHeader();
      if (after) after(); else showHome();
    });
  }
  function statusPill(t) {
    var n = 0; (t.my_subs || []).forEach(function (x) { n += x.n || 0; });
    if (n && (t.sub_status === 'auto' || t.sub_status === 'ok')) return '<span class="pill p-green">✓ ' + n + ' зураг · +</span>';
    if (n && t.sub_status === 'review') return '<span class="pill p-blue">✓ ' + n + ' зураг илгээсэн</span>';
    if (t.sub_status === 'auto' || t.sub_status === 'ok') return '<span class="pill p-green">+ Батлагдсан</span>';
    if (t.sub_status === 'review') return '<span class="pill p-blue">Илгээсэн</span>';
    if (t.sub_status === 'redo') return '<span class="pill p-amber">↺ Багш буцаасан · дахин илгээ</span>';
    return '<span class="pill p-red">Илгээгээгүй</span>';
  }
  function avatarSvg(lv, lazy) {
    var a = lazy ? 0 : 1, s = lazy ? 1 : 0;
    return '<svg width="92" height="100" viewBox="0 0 110 120" role="img" aria-label="Миний дүр">' +
      '<rect x="22" y="2" width="66" height="10" rx="3" fill="#F5D547" opacity="' + (lv >= 4 ? 1 : 0) + '"/><path d="M30 14 Q55 -6 80 14 Z" fill="#F5D547" opacity="' + (lv >= 4 ? 1 : 0) + '"/>' +
      '<rect x="25" y="14" width="60" height="50" rx="16" fill="#DCE6FF" stroke="#1E2A5A" stroke-width="2.5"/>' +
      '<circle cx="43" cy="38" r="5" fill="#1E2A5A" opacity="' + a + '"/><circle cx="67" cy="38" r="5" fill="#1E2A5A" opacity="' + a + '"/>' +
      '<path d="M37 39 h12 M61 39 h12" stroke="#1E2A5A" stroke-width="3" stroke-linecap="round" opacity="' + s + '"/>' +
      '<path d="M44 52 Q55 60 66 52" fill="none" stroke="#1E2A5A" stroke-width="3" stroke-linecap="round" opacity="' + a + '"/>' +
      '<path d="M48 54 h14" stroke="#1E2A5A" stroke-width="3" stroke-linecap="round" opacity="' + s + '"/>' +
      '<text x="86" y="18" font-size="14" font-weight="700" fill="#5A6178" opacity="' + s + '">z z</text>' +
      '<rect x="30" y="68" width="50" height="40" rx="12" fill="' + (lazy ? '#C5CADB' : '#7FB2FF') + '" stroke="#1E2A5A" stroke-width="2.5"/>' +
      '<path d="M84 70 L98 52" stroke="#E07A1F" stroke-width="5" stroke-linecap="round" opacity="' + (lv >= 2 ? 1 : 0) + '"/>' +
      '<path d="M12 104 L20 76 L28 104 M20 76 v-6" fill="none" stroke="#1E2A5A" stroke-width="2.5" stroke-linecap="round" opacity="' + (lv >= 3 ? 1 : 0) + '"/>' +
      '<path d="M55 80 l3 6 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1 z" fill="#F5D547" stroke="#1E2A5A" stroke-width="1.2" opacity="' + (lv >= 5 ? 1 : 0) + '"/></svg>';
  }
  // ---------- ШАЛГАЛТ (student) ----------
  var EXN = { garaa: 'Гарааны шалгалт', yavts: 'Явцын шалгалт', ulir: 'Улирлын шалгалт' };
  function loadExams() {
    var box = document.getElementById('exBox'); if (!box) return;
    sb.rpc('student_exams', { p_token: token }).then(function (r) {
      var list = (r.data || []).filter(function (e) { return !e.done ? new Date(e.ends_at) > new Date() : true; });
      if (!list.length) { box.innerHTML = ''; return; }
      box.innerHTML = list.map(function (e) {
        var open = !e.done && new Date(e.ends_at) > new Date();
        return '<div class="card" style="border:2px solid ' + (open ? '#B42318' : '#C5CADB') + ';gap:8px"><div class="row"><span class="pill ' + (open ? 'p-red' : 'p-green') + '">' + (EXN[e.type] || 'Шалгалт') + '</span>' +
          (open ? '<span class="muted">' + fmtDate(e.ends_at) + ' хүртэл</span>' : '') + '</div><b style="font-size:17px">' + esc(e.name) + '</b>' +
          (e.done ? '<div style="font-weight:700;color:#1C6B40">✓ Өгсөн' + (e.result ? ' · ' + e.result.score + '/' + e.result.total : '') + '</div>'
            : '<button class="btn" data-exstart="' + e.id + '">Шалгалт эхлэх</button>') + '</div>';
      }).join('');
      box.querySelectorAll('[data-exstart]').forEach(function (b) { b.onclick = function () { startExam(b.dataset.exstart); }; });
    });
  }
  function startExam(id) {
    app.innerHTML = '<div class="muted">Шалгалт ачаалж байна…</div>';
    sb.rpc('student_exam', { p_token: token, p_exam: id }).then(function (r) {
      var d = r.data || {};
      if (d.error) { toast(d.error === 'done' ? 'Та энэ шалгалтыг өгсөн байна' : 'Шалгалт хаагдсан байна'); showHome(); return; }
      var ans = {}, n, html = '<button class="link" id="back">← Буцах</button><span class="pill p-red" style="align-self:flex-start">' + (EXN[d.type] || 'Шалгалт') + '</span><h1>' + esc(d.name) + '</h1>' +
        '<div class="muted" id="exLeft"></div>';
      if (d.mode === 'forms') {
        html += '<div class="card" style="gap:10px"><div>Энэ шалгалтыг Google Forms дээр өгнө. <b>"Таны код"</b> асуултад <b style="font-size:18px">' + esc(home.code) + '</b> гэж заавал бичнэ үү.</div><a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" target="_blank" rel="noopener" href="' + esc(d.forms_url) + '">Шалгалт нээх ↗</a><div class="muted">Дүнг багш оруулна.</div></div>';
        app.innerHTML = html; document.getElementById('back').onclick = showHome; return;
      }
      var sendExam = function (ans, ph, b, err, done) {
        var ups = []; Object.keys(ph || {}).forEach(function (i) { ph[i].forEach(function (p, j) { var path = id + '/' + d.sid + '/d' + i + '-' + Date.now() + '-' + j + '.jpg'; ups.push(sb.storage.from('submissions').upload(path, p.blob, { contentType: 'image/jpeg', upsert: false }).then(function (r) { if (r.error) throw r.error; return { i: i, path: path }; })); }); });

  function shrink(file) {
    return new Promise(function (res, rej) {
      var img = new Image(); var url = URL.createObjectURL(file);
      img.onload = function () {
        var max = 1280, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var s = document.createElement('canvas'); s.width = 9; s.height = 8; var sx = s.getContext('2d');
        sx.drawImage(img, 0, 0, 9, 8); var px = sx.getImageData(0, 0, 9, 8).data, bits = '';
        for (var y = 0; y < 8; y++) for (var x = 0; x < 8; x++) {
          var a = (y * 9 + x) * 4, b = (y * 9 + x + 1) * 4;
          bits += (px[a] + px[a + 1] + px[a + 2]) > (px[b] + px[b + 1] + px[b + 2]) ? '1' : '0';
        }
        var hex = ''; for (var i = 0; i < 64; i += 4) hex += parseInt(bits.substr(i, 4), 2).toString(16);
        URL.revokeObjectURL(url);
        var pv = document.createElement('canvas'), pk = Math.min(1, 360 / Math.max(c.width, c.height)); pv.width = Math.round(c.width * pk); pv.height = Math.round(c.height * pk);
        pv.getContext('2d').drawImage(c, 0, 0, pv.width, pv.height);
        var cw = Math.round(c.width * 0.42), ch = Math.round(c.height * 0.3), cr = document.createElement('canvas'), ck = Math.min(1, 480 / cw);
        cr.width = Math.round(cw * ck); cr.height = Math.round(ch * ck);
        cr.getContext('2d').drawImage(c, 0, c.height - ch, cw, ch, 0, 0, cr.width, cr.height);
        c.toBlob(function (blob) { res({ blob: blob, hash: hex, preview: pv.toDataURL('image/jpeg', 0.6), corner: cr.toDataURL('image/jpeg', 0.8), codeOk: null }); }, 'image/jpeg', 0.72);
      };
      img.onerror = rej; img.src = url;
    });
  }

      };
      if (o.until) { var tm = ov.querySelector('#xsTm'), tick = function () { if (!document.body.contains(tm)) return; var ms = new Date(o.until) - Date.now(); if (ms <= 0) { tm.textContent = '⏰ Дууслаа'; tm.className = 'xs-tm end'; return; } tm.textContent = '⏱ ' + Math.floor(ms / 60000) + ':' + String(Math.floor(ms / 1000) % 60).padStart(2, '0'); if (ms < 300000) tm.className = 'xs-tm end'; clearTimeout(ov._t); ov._t = setTimeout(tick, 1000); }; tick(); }
    }
    render();
  }
  function showFileTest(t, d) {
    var L = (d.labels === 'cyr' ? 'АБВГДЕ' : 'abcdef').slice(0, d.opts || 4).split('');
    examSplit({ title: 'Тест · ' + t.title, files: d.files, n: d.n, labels: L, until: t.test_until, draw: [], onBack: showTopic,
      onSubmit: function (ans, ph, b, err, close) {
        sb.rpc('student_finish_test', { p_token: token, p_lesson: t.id, p_answers: ans }).then(function (r) {
          var d2 = r.data || {}; close();
          if (d2.error) { toast(d2.error === 'done' ? 'Та тест өгсөн байна' : 'Тест хаагдсан байна'); }
          loadHome(function () {
            curTopic = home.topics.filter(function (x) { return x.id === t.id; })[0] || t;
            app.innerHTML = '<div class="card" style="align-items:center;text-align:center;padding:28px 18px"><h1>Таны дүн: ' + (d2.score != null ? d2.score + '/' + d2.total : '—') + '</h1>' +
              '<div class="muted">Дүн багшийн журналд автоматаар бүртгэгдлээ.</div><button class="btn" id="ok">Сэдэв рүү буцах</button></div>';
            document.getElementById('ok').onclick = showTopic;
          });
        });
      } });
  }
  function runTimer() { var tt = app.querySelector('.ttimer'); if (!tt) return; var tick = function () { if (!document.body.contains(tt)) return; var ms = new Date(tt.dataset.until) - Date.now(); if (ms <= 0) { tt.textContent = '⏰ Хугацаа дууссан · одоо илгээнэ үү'; tt.classList.add('end'); return; } var m = Math.floor(ms / 60000), sx = Math.floor(ms / 1000) % 60; tt.textContent = '⏱ ' + m + ':' + String(sx).padStart(2, '0') + ' үлдсэн'; if (ms < 5 * 60000) tt.classList.add('end'); setTimeout(tick, 1000); }; tick(); }
  function showTest() {
    var t = curTopic;
    app.innerHTML = '<div class="muted">Тест ачаалж байна…</div>';
    sb.rpc('student_test', { p_token: token, p_lesson: t.id }).then(function (r) {
      var d = r.data || {};
      if (d.error) { toast(d.error === 'done' ? 'Та тест өгсөн байна' : 'Тест хаагдсан байна'); loadHome(function () { showTopic(); }); return; }
      if (d.mode === 'file') { showFileTest(t, d); return; }
      var qs = d.questions || [], ans = {};
      var html = '<button class="link" id="back">← Буцах</button><h1>Тест · ' + esc(t.title) + '</h1>' + (t.test_until ? '<div class="ttimer" data-until="' + esc(t.test_until) + '"></div>' : '');
      qs.forEach(function (q, i) {
        html += '<div class="card"><b style="line-height:1.4">' + (i + 1) + '. ' + esc(q.q) + '</b>' + (q.img ? '<img alt="" src="' + esc(q.img) + '" style="width:100%;border-radius:8px">' : '') +
          (q.opts || []).map(function (o, j) { return '<button class="opt" data-q="' + i + '" data-o="' + j + '">' + esc(o) + '</button>'; }).join('') + '</div>';
      });
      html += '<div class="err" id="err"></div><button class="btn" id="fin">Илгээх</button>';
      app.innerHTML = html;
      document.getElementById('back').onclick = showTopic;
      runTimer();
      app.querySelectorAll('.opt').forEach(function (b) {
        b.onclick = function () {
          ans[b.dataset.q] = +b.dataset.o;
          app.querySelectorAll('.opt[data-q="' + b.dataset.q + '"]').forEach(function (x) { x.classList.toggle('on', x === b); });
        };
      });
      document.getElementById('fin').onclick = function () {
        if (Object.keys(ans).length < qs.length) { document.getElementById('err').textContent = 'Бүх асуултад хариулна уу.'; return; }
        this.disabled = true;
        sb.rpc('student_finish_test', { p_token: token, p_lesson: t.id, p_answers: ans }).then(function (r) {
          var d2 = r.data || {};
          loadHome(function () {
            curTopic = home.topics.filter(function (x) { return x.id === t.id; })[0] || t;
            app.innerHTML = '<div class="card" style="align-items:center;text-align:center;padding:28px 18px"><h1>Таны дүн: ' + (d2.score != null ? d2.score + '/' + d2.total : '—') + '</h1>' +
              '<div class="muted">Дүн багшийн журналд автоматаар бүртгэгдлээ.</div><button class="btn" id="ok">Сэдэв рүү буцах</button></div>';
            document.getElementById('ok').onclick = showTopic;
          });
        });
      };
      window.scrollTo(0, 0);
    });
  }

  if (cls) sb.rpc('class_info', { p_class: cls }).then(function (r) { if (r.data) { info = r.data; setHeader(); } });
  var autoPin = params.get('p');
  if (preCode && autoPin) {
    try { history.replaceState(null, '', location.pathname + '?c=' + encodeURIComponent(cls)); } catch (e) {}
    app.innerHTML = '<div class="muted">Нэвтэрч байна…</div>';
    sb.rpc('student_login', { p_code: preCode, p_pin: autoPin, p_class: cls }).then(function (r) {
      var d = r.data || {};
      if (d.token) { token = d.token; try { localStorage.setItem('tok', token); } catch (e) {} loadHome(); }
      else showLogin(d.error === 'locked' ? 'Олон удаа буруу оролдсон. 15 минутын дараа дахин оролдоно уу.' : 'Энэ QR хуучирсан байна. Багшаасаа шинэ карт аваарай.');
    });
  } else if (token) loadHome(); else showLogin();
})();
</script>
