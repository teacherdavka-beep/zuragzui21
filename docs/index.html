<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зураг зүй · Ангийн самбар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F6FA;font-family:Inter,system-ui,sans-serif;color:#1A1F36;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;font-size:16px}
button{cursor:pointer}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:#1E2A5A;color:#fff;padding:20px 20px 16px}
header .sub{font-size:13px;color:#C9D1F0}
header .ttl{font-size:24px;font-weight:700;margin-top:2px}
main{flex:1;padding:18px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid #E1E4EE;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:20px}
h2{margin:0;font-size:16px}
.muted{color:#5A6178;font-size:13px;line-height:1.5}
label{font-size:14px;font-weight:600}
select,input[type=password],input[type=text]{height:50px;border:1px solid #C5CADB;border-radius:10px;padding:0 12px;background:#fff;color:#1A1F36;width:100%}
.btn{height:50px;border:0;border-radius:12px;background:#2747B8;color:#fff;font-weight:600;font-size:16px;width:100%}
.btn.sec{background:#fff;color:#2747B8;border:1.5px solid #2747B8}
.btn.dark{background:#1E2A5A}
.btn:disabled{opacity:.55}
.link{background:none;border:0;color:#2747B8;font-weight:600;padding:8px 0;align-self:flex-start;min-height:44px}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.p-red{background:#FDECEA;color:#A12A1E}.p-green{background:#E3F4EA;color:#1C6B40}.p-blue{background:#EEF1FA;color:#2747B8}.p-amber{background:#FFF3E5;color:#8A4B0B}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.topic{text-align:left;background:#fff;border:1.5px solid #E1E4EE;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;width:100%;color:#1A1F36}
.topic.now{border-color:#2747B8}
.locked{background:#F0F2F7}
.err{color:#B42318;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumbs img{width:100%;height:76px;object-fit:cover;border-radius:8px;border:1px solid #C5CADB}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{height:50px;border-radius:10px;border:1.5px solid #C5CADB;background:#fff;font-weight:600;color:#1A1F36}
.choice button.on{background:#B42318;border-color:#B42318;color:#fff}
.choice button.on2{background:#1E2A5A;border-color:#1E2A5A;color:#fff}
.opt{text-align:left;min-height:46px;padding:10px 12px;border-radius:10px;border:1.5px solid #D5DAE8;background:#fff;color:#1A1F36;width:100%}
.opt.on{border-color:#2747B8;background:#EEF1FA}
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bar{height:10px;border-radius:99px;background:#EEF1FA;overflow:hidden}.bar>div{height:10px;background:#2747B8}
.faces{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1A1F36;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:9;max-width:90%}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="sub" id="hSub">Зураг зүй</div>
    <div class="ttl" id="hTitle">Ангийн самбар</div>
    <div class="sub" id="hWho"></div>
  </header>
  <main id="app"><div class="muted">Ачаалж байна…</div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  var C = window.APP_CONFIG;
  var sb = window.supabase.createClient(C.url, C.key, { auth: { persistSession: false } });
  var app = document.getElementById('app');
  var params = new URLSearchParams(location.search);
  var cls = params.get('c') || localStorage.getItem('cls') || '';
  var preCode = params.get('s') || '';
  if (cls) { try { localStorage.setItem('cls', cls); } catch (e) {} }
  var token = null; try { token = localStorage.getItem('tok'); } catch (e) {}
  var home = null, curTopic = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3200); }
  function setHeader() {
    document.getElementById('hSub').textContent = C.school + ' · ' + C.subject;
    document.getElementById('hTitle').textContent = (home ? home['class'] : cls) ? ((home ? home['class'] : cls) + ' анги') : 'Ангийн самбар';
    document.getElementById('hWho').textContent = home ? (home.name + ' · ' + home.code) : '';
  }
  function fmtDate(d) { if (!d) return ''; var x = new Date(d); return (x.getMonth() + 1) + '/' + x.getDate(); }
  function logout() { try { localStorage.removeItem('tok'); } catch (e) {} token = null; home = null; showLogin(); }

  // ---------- LOGIN ----------
  function showLogin(msg) {
    setHeader();
    if (!cls) {
      app.innerHTML = '<div class="card"><h1>Ангийн линк хэрэгтэй</h1><div class="muted">Багшийн өгсөн QR кодыг уншуулж, эсвэл ангийн линкээр орно уу.</div></div>';
      return;
    }
    app.innerHTML = '<div class="card"><h1>Ангидаа нэвтрэх</h1><div class="muted">Кодоо сонгоод 4 оронтой тоогоо бичнэ үү.</div>' +
      '<label for="code">Миний код</label><select id="code"><option value="">Ачаалж байна…</option></select>' +
      '<label for="pin">4 оронтой тоо</label><div style="display:flex;gap:8px"><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" style="font-size:22px;letter-spacing:8px;flex:1;min-width:0"><button type="button" id="eye" aria-pressed="false" style="height:50px;padding:0 14px;border-radius:10px;border:1px solid #C5CADB;background:#fff;color:#1A1F36;font-weight:600">Харах</button></div>' +
      '<div class="err" id="err">' + esc(msg || '') + '</div><button class="btn" id="go">Орох</button>' +
      '<div class="muted">Кодоо мартсан бол багшаасаа асуугаарай.</div></div>';
    sb.rpc('class_codes', { p_class: cls }).then(function (r) {
      var sel = document.getElementById('code'); if (!sel) return;
      var list = r.data || [];
      sel.innerHTML = '<option value="">Кодоо сонгоно уу</option>' + list.map(function (c) { return '<option' + (c === preCode ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('');
      if (!list.length) sel.innerHTML = '<option value="">Энэ ангид сурагч бүртгэгдээгүй</option>';
    });
    var pin = document.getElementById('pin');
    document.getElementById('eye').onclick = function () { var show = pin.type === 'password'; pin.type = show ? 'text' : 'password'; this.textContent = show ? 'Нуух' : 'Харах'; this.setAttribute('aria-pressed', show); };
    pin.addEventListener('input', function () { pin.value = pin.value.replace(/\D/g, '').slice(0, 4); });
    document.getElementById('go').onclick = function () {
      var code = document.getElementById('code').value, p = pin.value, err = document.getElementById('err');
      if (!code) { err.textContent = 'Кодоо сонгоно уу.'; return; }
      if (p.length !== 4) { err.textContent = '4 оронтой тоо бичнэ үү.'; return; }
      this.disabled = true;
      var b = this;
      sb.rpc('student_login', { p_code: code, p_pin: p }).then(function (r) {
        b.disabled = false;
        var d = r.data || {};
        if (d.token) { token = d.token; try { localStorage.setItem('tok', token); } catch (e) {} loadHome(); }
        else if (d.error === 'locked') err.textContent = 'Олон удаа буруу бичсэн. 15 минутын дараа дахин оролдоно уу.';
        else err.textContent = 'Код эсвэл тоо буруу байна.';
      });
    };
  }

  // ---------- HOME ----------
  function loadHome(after) {
    sb.rpc('student_home', { p_token: token }).then(function (r) {
      if (r.error) { logout(); return; }
      home = r.data; setHeader();
      if (after) after(); else showHome();
    });
  }
  function statusPill(t) {
    if (t.sub_status === 'auto' || t.sub_status === 'ok') return '<span class="pill p-green">+ Батлагдсан</span>';
    if (t.sub_status === 'review') return '<span class="pill p-blue">Илгээсэн</span>';
    if (t.sub_status === 'redo') return '<span class="pill p-amber">Дахин хийх</span>';
    return '<span class="pill p-red">Илгээгээгүй</span>';
  }
  function avatarSvg(lv, lazy) {
    var a = lazy ? 0 : 1, s = lazy ? 1 : 0;
    return '<svg width="92" height="100" viewBox="0 0 110 120" role="img" aria-label="Миний дүр">' +
      '<rect x="22" y="2" width="66" height="10" rx="3" fill="#F5D547" opacity="' + (lv >= 4 ? 1 : 0) + '"/><path d="M30 14 Q55 -6 80 14 Z" fill="#F5D547" opacity="' + (lv >= 4 ? 1 : 0) + '"/>' +
      '<rect x="25" y="14" width="60" height="50" rx="16" fill="#DCE6FF" stroke="#1E2A5A" stroke-width="2.5"/>' +
      '<circle cx="43" cy="38" r="5" fill="#1E2A5A" opacity="' + a + '"/><circle cx="67" cy="38" r="5" fill="#1E2A5A" opacity="' + a + '"/>' +
      '<path d="M37 39 h12 M61 39 h12" stroke="#1E2A5A" stroke-width="3" stroke-linecap="round" opacity="' + s + '"/>' +
      '<path d="M44 52 Q55 60 66 52" fill="none" stroke="#1E2A5A" stroke-width="3" stroke-linecap="round" opacity="' + a + '"/>' +
      '<path d="M48 54 h14" stroke="#1E2A5A" stroke-width="3" stroke-linecap="round" opacity="' + s + '"/>' +
      '<text x="86" y="18" font-size="14" font-weight="700" fill="#5A6178" opacity="' + s + '">z z</text>' +
      '<rect x="30" y="68" width="50" height="40" rx="12" fill="' + (lazy ? '#C5CADB' : '#7FB2FF') + '" stroke="#1E2A5A" stroke-width="2.5"/>' +
      '<path d="M84 70 L98 52" stroke="#E07A1F" stroke-width="5" stroke-linecap="round" opacity="' + (lv >= 2 ? 1 : 0) + '"/>' +
      '<path d="M12 104 L20 76 L28 104 M20 76 v-6" fill="none" stroke="#1E2A5A" stroke-width="2.5" stroke-linecap="round" opacity="' + (lv >= 3 ? 1 : 0) + '"/>' +
      '<path d="M55 80 l3 6 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1 z" fill="#F5D547" stroke="#1E2A5A" stroke-width="1.2" opacity="' + (lv >= 5 ? 1 : 0) + '"/></svg>';
  }
  function showHome() {
    var xp = home.xp || 0;
    var L = [[0, 'Шавь'], [50, 'Зураач'], [120, 'Зураг төсөлч'], [220, 'Инженер'], [350, 'Архитектор']];
    var i = 0; while (i < L.length - 1 && xp >= L[i + 1][0]) i++;
    var next = L[i + 1];
    var pct = next ? Math.round((xp - L[i][0]) / (next[0] - L[i][0]) * 100) : 100;
    var lazy = (home.pending_old || 0) > 0;
    var counts = { phone: 0, sleep: 0, late: 0, disrupt: 0 };
    (home.behavior || []).forEach(function (b) { if (counts[b.kind] != null) counts[b.kind]++; });
    var beh = [];
    if (counts.phone) beh.push('Утас ' + counts.phone); if (counts.sleep) beh.push('Унтсан ' + counts.sleep);
    if (counts.late) beh.push('Хоцорсон ' + counts.late); if (counts.disrupt) beh.push('Саад ' + counts.disrupt);
    var html = '<div class="card"><div style="display:flex;gap:12px;align-items:center">' + avatarSvg(i + 1, lazy) +
      '<div style="flex:1;display:flex;flex-direction:column;gap:5px"><span class="muted">Миний дүр · ' + (i + 1) + '-р түвшин</span>' +
      '<b style="font-size:18px">' + L[i][1] + '</b>' +
      '<span style="font-size:13px;font-weight:600;color:' + (lazy ? '#8A4B0B' : '#1C6B40') + '">' + (lazy ? 'Нойрмог байна · ' + home.pending_old + ' ажлаа нөхөөрэй' : 'Сэргэг байна') + '</span>' +
      '<div class="bar"><div style="width:' + pct + '%"></div></div><span class="muted">' + xp + ' оноо' + (next ? ' · дараагийн түвшин ' + next[0] : '') + '</span></div></div>' +
      '<div class="muted">Энэ сарын хичээлийн тэмдэглэл: ' + (beh.length ? esc(beh.join(', ')) + ' удаа' : 'тэмдэглэл алга, сайн байна') + '</div></div>';
    html += '<h1 style="font-size:18px">Сэдвүүд</h1><div class="muted">Хоцорсон хичээлээ эндээс нөхнө. Видео үргэлж нээлттэй.</div>';
    if (!home.topics.length) html += '<div class="card muted">Багш одоогоор сэдэв нээгээгүй байна.</div>';
    home.topics.forEach(function (t, k) {
      var isNew = t.tasks_open || t.test_open;
      html += '<button class="topic' + (isNew ? ' now' : '') + '" data-k="' + k + '"><div class="row"><span style="font-size:12px;font-weight:600;color:' + (isNew ? '#2747B8' : '#5A6178') + '">' +
        (isNew ? 'Нээлттэй даалгавартай' : fmtDate(t.opened_at) + ' · ' + esc(t.unit)) + '</span>' + statusPill(t) + '</div>' +
        '<b style="font-size:16px">' + esc(t.title) + '</b></button>';
    });
    html += '<button class="link" id="out">Гарах</button>';
    app.innerHTML = html;
    app.querySelectorAll('.topic').forEach(function (b) { b.onclick = function () { curTopic = home.topics[+b.dataset.k]; showTopic(); }; });
    document.getElementById('out').onclick = logout;
    window.scrollTo(0, 0);
  }

  function videoHtml(url) {
    if (!url) return '<div class="muted">Видео удахгүй нэмэгдэнэ.</div>';
    var m = url.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
    if (m) return '<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/' + m[1] + '" allowfullscreen title="Видео хичээл"></iframe></div>';
    var d = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
    if (d) return '<div class="video"><iframe src="https://drive.google.com/file/d/' + d[1] + '/preview" allowfullscreen title="Видео хичээл"></iframe></div>';
    return '<a class="btn sec" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="' + esc(url) + '" target="_blank" rel="noopener">Видео нээх</a>';
  }

  // ---------- TOPIC ----------
  function showTopic() {
    var t = curTopic;
    var sent = t.sub_status === 'auto' || t.sub_status === 'ok' || t.sub_status === 'review';
    var lockIcon = '<span class="pill p-blue" style="background:#E1E4EE;color:#5A6178">Хаалттай</span>';
    var html = '<button class="link" id="back">← Сэдвүүд</button><h1>' + esc(t.title) + '</h1>' +
      '<div class="card"><div class="row"><h2>Видео хичээл</h2><span class="pill p-green">Үргэлж нээлттэй</span></div>' + videoHtml(t.video_url) + '<div class="muted">Ойлгоогүй хэсгээ дахин үзээрэй.</div></div>' +
      '<div class="card"><div class="row"><h2>Зурсан зургаа илгээх</h2>' + statusPill(t) + '</div><div class="muted">Үргэлж нээлттэй · хоцорсон бол нөхөж илгээнэ</div>' +
      '<button class="btn" id="send">' + (sent ? 'Дахин илгээх' : (t.tasks_open ? 'Зураг илгээх' : 'Нөхөж илгээх')) + '</button></div>';
    html += '<div class="card' + (t.tasks_open ? '' : ' locked') + '"><div class="row"><h2>Дасгал ажил, даалгавар</h2>' + (t.tasks_open ? '' : lockIcon) + '</div>' +
      (t.tasks_open ? '<div class="muted">Багш нээсэн' + (t.due_at ? ' · хугацаа ' + fmtDate(t.due_at) : '') + '</div>' +
        (t.exercise_url ? '<a class="btn sec" style="display:flex;align-items:center;justify-content:center;text-decoration:none" target="_blank" rel="noopener" href="' + esc(t.exercise_url) + '">Дасгалын хуудас харах</a>' : '<div class="muted">Дасгалын хуудсыг багш ангид тараана.</div>')
        : '<div class="muted">Багш нээх үед энд гарна</div>') + '</div>';
    html += '<div class="card' + (t.test_open || t.test_result ? '' : ' locked') + '"><div class="row"><h2>Тест</h2>' +
      (t.test_result ? '<span class="pill p-green">Дүн ' + t.test_result.score + '/' + t.test_result.total + '</span>' : (t.test_open ? '' : lockIcon)) + '</div>' +
      (t.test_result ? '<div class="muted">Тест өгсөн. Дүн журналд орсон.</div>' :
        (t.test_open && t.test_count ? '<div class="muted">Багш нээсэн · ' + t.test_count + ' асуулт · шууд дүгнэгдэнэ</div><button class="btn sec" id="test">Тест эхлэх</button>' :
          '<div class="muted">Багш нээх үед энд гарна</div>')) + '</div>';
    app.innerHTML = html;
    document.getElementById('back').onclick = function () { loadHome(); };
    document.getElementById('send').onclick = showSubmit;
    var tb = document.getElementById('test'); if (tb) tb.onclick = showTest;
    window.scrollTo(0, 0);
  }

  // ---------- SUBMIT ----------
  function shrink(file) {
    return new Promise(function (res, rej) {
      var img = new Image(); var url = URL.createObjectURL(file);
      img.onload = function () {
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var s = document.createElement('canvas'); s.width = 9; s.height = 8; var sx = s.getContext('2d');
        sx.drawImage(img, 0, 0, 9, 8); var px = sx.getImageData(0, 0, 9, 8).data, bits = '';
        for (var y = 0; y < 8; y++) for (var x = 0; x < 8; x++) {
          var a = (y * 9 + x) * 4, b = (y * 9 + x + 1) * 4;
          bits += (px[a] + px[a + 1] + px[a + 2]) > (px[b] + px[b + 1] + px[b + 2]) ? '1' : '0';
        }
        var hex = ''; for (var i = 0; i < 64; i += 4) hex += parseInt(bits.substr(i, 4), 2).toString(16);
        URL.revokeObjectURL(url);
        c.toBlob(function (blob) { res({ blob: blob, hash: hex, preview: c.toDataURL('image/jpeg', 0.5) }); }, 'image/jpeg', 0.82);
      };
      img.onerror = rej; img.src = url;
    });
  }
  function showSubmit() {
    var t = curTopic, photos = [], claim = null;
    app.innerHTML = '<button class="link" id="back">← Буцах</button><h1>Зураг илгээх</h1><div class="muted">' + esc(t.title) + '</div>' +
      '<input id="cam" type="file" accept="image/*" capture="environment" hidden>' +
      '<button class="btn dark" id="take" style="height:62px;font-size:17px">Зурсан зургаа авах</button>' +
      '<div id="ph"></div><div class="muted">Хуудсаа гэрэлтэй газар, дээрээс нь шулуун авна. Хүрээ, багшийн улаан "+" бүтэн орсон байх ёстой. 4 хүртэл хуудас.</div>' +
      '<div class="card"><label>Багш ангид "+" тавьсан уу?</label><div class="choice"><button id="yes">Тийм, + авсан</button><button id="no">Үзүүлээгүй</button></div>' +
      '<div class="muted">Худал бичвэл илэрнэ: багш санамсаргүй шалгадаг.</div></div>' +
      '<div class="err" id="err"></div><button class="btn" id="go">Илгээх</button>';
    var cam = document.getElementById('cam');
    document.getElementById('back').onclick = showTopic;
    document.getElementById('take').onclick = function () { if (photos.length >= 4) { toast('4 хүртэл зураг'); return; } cam.click(); };
    cam.onchange = function () {
      var f = cam.files[0]; cam.value = ''; if (!f) return;
      shrink(f).then(function (p) { photos.push(p); drawPh(); }).catch(function () { toast('Зураг уншиж чадсангүй'); });
    };
    function drawPh() {
      document.getElementById('ph').innerHTML = photos.length ? '<div class="muted" style="margin-bottom:6px"><b>' + photos.length + ' зураг</b> · дахин дарж нэмнэ</div><div class="thumbs">' +
        photos.map(function (p) { return '<img alt="" src="' + p.preview + '">'; }).join('') + '</div>' : '';
    }
    var yes = document.getElementById('yes'), no = document.getElementById('no');
    yes.onclick = function () { claim = true; yes.className = 'on'; no.className = ''; };
    no.onclick = function () { claim = false; no.className = 'on2'; yes.className = ''; };
    document.getElementById('go').onclick = function () {
      var err = document.getElementById('err'), b = this;
      if (!photos.length) { err.textContent = 'Эхлээд зургаа авна уу.'; return; }
      if (claim === null) { err.textContent = '"+" авсан эсэхээ сонгоно уу.'; return; }
      b.disabled = true; b.textContent = 'Илгээж байна…';
      Promise.resolve().then(function () {
        var uploads = photos.map(function (p, i) {
          var path = t.id + '/' + home.sid + '/' + Date.now() + '-' + i + '.jpg';
          return sb.storage.from('submissions').upload(path, p.blob, { contentType: 'image/jpeg', upsert: false }).then(function (r) { if (r.error) throw r.error; return path; });
        });
        return Promise.all(uploads);
      }).then(function (paths) {
        return sb.rpc('student_submit', { p_token: token, p_lesson: t.id, p_paths: paths, p_hashes: photos.map(function (p) { return p.hash; }), p_claimed: claim });
      }).then(function (r) {
        if (r.error) throw r.error;
        var auto = r.data && r.data.status === 'auto';
        loadHome(function () {
          curTopic = home.topics.filter(function (x) { return x.id === t.id; })[0] || t;
          app.innerHTML = '<div class="card" style="align-items:center;text-align:center;padding:28px 18px">' +
            '<svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Амжилттай"><circle cx="32" cy="32" r="30" fill="#E3F4EA"/><path d="M20 33 L28 41 L45 24" fill="none" stroke="#1C6B40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '<h1>Илгээгдлээ</h1><div class="muted">' + (auto ? '+20 оноо! Журналд автоматаар орлоо.' : 'Багш шалгаад журналд оруулна.') + '</div>' +
            '<button class="btn" id="ok">Сэдэв рүү буцах</button></div>';
          document.getElementById('ok').onclick = showTopic;
        });
      }).catch(function (e) {
        b.disabled = false; b.textContent = 'Илгээх';
        err.textContent = 'Илгээж чадсангүй. Интернэтээ шалгаад дахин оролдоно уу.';
        console.error(e);
      });
    };
  }

  // ---------- TEST ----------
  function showTest() {
    var t = curTopic;
    app.innerHTML = '<div class="muted">Тест ачаалж байна…</div>';
    sb.rpc('student_test', { p_token: token, p_lesson: t.id }).then(function (r) {
      var d = r.data || {};
      if (d.error) { toast(d.error === 'done' ? 'Та тест өгсөн байна' : 'Тест хаагдсан байна'); loadHome(function () { showTopic(); }); return; }
      var qs = d.questions || [], ans = {};
      var html = '<button class="link" id="back">← Буцах</button><h1>Тест · ' + esc(t.title) + '</h1>';
      qs.forEach(function (q, i) {
        html += '<div class="card"><b style="line-height:1.4">' + (i + 1) + '. ' + esc(q.q) + '</b>' + (q.img ? '<img alt="" src="' + esc(q.img) + '" style="width:100%;border-radius:8px">' : '') +
          (q.opts || []).map(function (o, j) { return '<button class="opt" data-q="' + i + '" data-o="' + j + '">' + esc(o) + '</button>'; }).join('') + '</div>';
      });
      html += '<div class="err" id="err"></div><button class="btn" id="fin">Илгээх</button>';
      app.innerHTML = html;
      document.getElementById('back').onclick = showTopic;
      app.querySelectorAll('.opt').forEach(function (b) {
        b.onclick = function () {
          ans[b.dataset.q] = +b.dataset.o;
          app.querySelectorAll('.opt[data-q="' + b.dataset.q + '"]').forEach(function (x) { x.classList.toggle('on', x === b); });
        };
      });
      document.getElementById('fin').onclick = function () {
        if (Object.keys(ans).length < qs.length) { document.getElementById('err').textContent = 'Бүх асуултад хариулна уу.'; return; }
        this.disabled = true;
        sb.rpc('student_finish_test', { p_token: token, p_lesson: t.id, p_answers: ans }).then(function (r) {
          var d2 = r.data || {};
          loadHome(function () {
            curTopic = home.topics.filter(function (x) { return x.id === t.id; })[0] || t;
            app.innerHTML = '<div class="card" style="align-items:center;text-align:center;padding:28px 18px"><h1>Таны дүн: ' + (d2.score != null ? d2.score + '/' + d2.total : '—') + '</h1>' +
              '<div class="muted">Дүн багшийн журналд автоматаар бүртгэгдлээ.</div><button class="btn" id="ok">Сэдэв рүү буцах</button></div>';
            document.getElementById('ok').onclick = showTopic;
          });
        });
      };
      window.scrollTo(0, 0);
    });
  }

  var autoPin = params.get('p');
  if (preCode && autoPin) {
    try { history.replaceState(null, '', location.pathname + '?c=' + encodeURIComponent(cls)); } catch (e) {}
    app.innerHTML = '<div class="muted">Нэвтэрч байна…</div>';
    sb.rpc('student_login', { p_code: preCode, p_pin: autoPin }).then(function (r) {
      var d = r.data || {};
      if (d.token) { token = d.token; try { localStorage.setItem('tok', token); } catch (e) {} loadHome(); }
      else showLogin(d.error === 'locked' ? 'Олон удаа буруу оролдсон. 15 минутын дараа дахин оролдоно уу.' : 'Энэ QR хуучирсан байна. Багшаасаа шинэ карт аваарай.');
    });
  } else if (token) loadHome(); else showLogin();
})();
</script>
</body>
</html>
