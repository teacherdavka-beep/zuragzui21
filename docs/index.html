<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">

<title>EduSolveMN · Ангийн самбар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F6FA;font-family:Inter,system-ui,sans-serif;color:#1A1F36;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;font-size:16px}
button{cursor:pointer}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:#1E2A5A;color:#fff;padding:20px 20px 16px}
header .sub{font-size:13px;color:#C9D1F0}
header .ttl{font-size:24px;font-weight:700;margin-top:2px}
main{flex:1;padding:18px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid #E1E4EE;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:20px}
h2{margin:0;font-size:16px}
.muted{color:#5A6178;font-size:13px;line-height:1.5}
label{font-size:14px;font-weight:600}
select,input[type=password],input[type=text]{height:50px;border:1px solid #C5CADB;border-radius:10px;padding:0 12px;background:#fff;color:#1A1F36;width:100%}
.btn{height:50px;border:0;border-radius:12px;background:#2747B8;color:#fff;font-weight:600;font-size:16px;width:100%}
.btn.sec{background:#fff;color:#2747B8;border:1.5px solid #2747B8}
.btn.dark{background:#1E2A5A}
.btn:disabled{opacity:.55}
.link{background:none;border:0;color:#2747B8;font-weight:600;padding:8px 0;align-self:flex-start;min-height:44px}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.p-red{background:#FDECEA;color:#A12A1E}.p-green{background:#E3F4EA;color:#1C6B40}.p-blue{background:#EEF1FA;color:#2747B8}.p-amber{background:#FFF3E5;color:#8A4B0B}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.topic{text-align:left;background:#fff;border:1.5px solid #E1E4EE;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;width:100%;color:#1A1F36}
.topic.now{border-color:#2747B8}
.locked{background:#F0F2F7}
.err{color:#B42318;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumbs img{width:100%;height:76px;object-fit:cover;border-radius:8px;border:1px solid #C5CADB}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.strip .ph{position:relative;flex:0 0 auto;width:120px;height:150px;border-radius:10px;overflow:hidden;border:1px solid #C5CADB;background:#EEF1FA;scroll-snap-align:start}
.strip .ph img{width:100%;height:100%;object-fit:cover;display:block}
.strip .ph .x{position:absolute;right:4px;top:4px;min-width:34px;height:34px;border-radius:99px;border:0;background:rgba(26,31,54,.8);color:#fff;font-size:15px;font-weight:700;padding:0 10px}
.strip .ph .x.sure{background:#B42318}
.strip .ph .no{position:absolute;left:6px;bottom:6px;background:rgba(26,31,54,.8);color:#fff;font-size:12px;border-radius:99px;padding:1px 8px}
textarea{width:100%;min-height:90px;border:1.5px solid #C5CADB;border-radius:10px;padding:10px;font:inherit;box-sizing:border-box}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{height:50px;border-radius:10px;border:1.5px solid #C5CADB;background:#fff;font-weight:600;color:#1A1F36}
.choice button.on{background:#B42318;border-color:#B42318;color:#fff}
.choice button.on2{background:#1E2A5A;border-color:#1E2A5A;color:#fff}
.opt{text-align:left;min-height:46px;padding:10px 12px;border-radius:10px;border:1.5px solid #D5DAE8;background:#fff;color:#1A1F36;width:100%}
.opt.on{border-color:#2747B8;background:#EEF1FA}
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bar{height:10px;border-radius:99px;background:#EEF1FA;overflow:hidden}.bar>div{height:10px;background:#2747B8}
.faces{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1A1F36;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:9;max-width:90%}
.ttimer{position:sticky;top:0;z-index:6;background:#1E2A5A;color:#fff;font-weight:800;text-align:center;border-radius:12px;padding:8px;font-size:16px}.ttimer.end{background:#B42318}.ttimer~.tbox{top:46px}
.tbox{background:#fff;border:1px solid #E1E4EE;border-radius:16px;overflow:hidden;position:sticky;top:0;z-index:5;box-shadow:0 6px 16px rgba(20,30,80,.12)}
.tbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #EEF1FA;font-size:13px}.tbar .muted{flex:1;font-size:12px}
.tbar button{border:1.5px solid #C5CADB;background:#fff;border-radius:99px;font-weight:700;font-size:13px;padding:6px 12px;color:#1A1F36}
.tpages{max-height:42vh;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:10px;background:#F4F6FB;-webkit-overflow-scrolling:touch}
.tbox.big .tpages{max-height:72vh}
.tpg{position:relative}.tpg span{position:absolute;left:8px;top:8px;background:rgba(26,31,54,.75);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px}
.tpg img{width:100%;display:block;border-radius:10px;border:1px solid #C5CADB;background:#fff;cursor:zoom-in}
.zov{position:fixed;inset:0;z-index:100;background:#111;display:flex;flex-direction:column}
.zbar{display:flex;gap:8px;padding:10px;padding-top:max(10px,env(safe-area-inset-top));background:#1A1F36}
.zbar button{height:44px;min-width:52px;border:0;border-radius:10px;background:#fff;font-size:20px;font-weight:800}.zbar #zx{margin-left:auto;font-size:15px;padding:0 14px}
.zsc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}.zsc img{width:100%;display:block;background:#fff}
@media(min-width:900px){.tpages{max-height:60vh}}
.xs{position:fixed;inset:0;z-index:90;background:#EEF1F7;display:flex;flex-direction:column;font-size:15px}
.xs-top{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:#1E2A5A;color:#fff}
.xs-top b{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.xs-top button{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:10px;height:36px;padding:0 10px;font-weight:700;font-size:13px}
.xs-tm{background:#fff;color:#1E2A5A;font-weight:800;border-radius:99px;padding:5px 10px;font-size:14px}.xs-tm.end{background:#B42318;color:#fff}
.xs-tabs{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;background:#fff;border-bottom:1px solid #E1E4EE;align-items:center}
.xs-tabs>button{flex:none;border:1.5px solid #C5CADB;background:#fff;border-radius:99px;height:34px;padding:0 12px;font-weight:700;font-size:13px;color:#1A1F36}
.xs-tabs>button.on{background:#1E2A5A;border-color:#1E2A5A;color:#fff}.xs-tabs>button.ok:not(.on){border-color:#1C7C4A;color:#1C7C4A}
.xs-z{margin-left:auto;display:flex;gap:4px;flex:none}.xs-z button{width:34px;height:34px;border-radius:9px;border:1.5px solid #C5CADB;background:#fff;font-size:18px;font-weight:800}
.xs-view{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;min-height:0}.xs-view>img{display:block;max-width:none}
.xs-draw{padding:12px;display:flex;flex-direction:column;gap:10px}.xs-tip{background:#FFF6E0;color:#7A4E00;border-radius:10px;padding:8px 10px;font-size:13px}
.xs-ph{display:flex;gap:8px;flex-wrap:wrap}.xs-ph>div{position:relative}.xs-ph img{width:96px;height:120px;object-fit:cover;border-radius:10px;border:1px solid #C5CADB}
.xs-ph>div button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:#B42318;color:#fff;font-weight:800}
.xs-cam{width:96px;height:120px;border:2px dashed #2747B8;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;color:#2747B8;font-size:13px;cursor:pointer;padding:6px}
.xs-ans{flex:0 0 auto;max-height:30vh;display:flex;flex-direction:column;background:#fff;border-top:2px solid #1E2A5A;box-shadow:0 -6px 16px rgba(20,30,80,.12)}
.xs-ah{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px}.xs-ah b{font-size:14px}.xs-ah span{color:#5B6478}
.xs-ah button{margin-left:auto;border:0;background:#2747B8;color:#fff;font-weight:800;border-radius:10px;height:36px;padding:0 16px}
.xs-ans .err{padding:0 10px;font-size:12.5px}
.xs-grid{overflow:auto;padding:4px 8px 10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;-webkit-overflow-scrolling:touch}
.xs-q{display:flex;align-items:center;gap:3px}.xs-q i{font-style:normal;font-weight:800;font-size:12.5px;width:22px;color:#5B6478}
.xs-q button{flex:1;min-width:0;height:30px;border-radius:7px;border:1px solid #D5DAE8;background:#fff;font-size:13px;font-weight:700;color:#1A1F36;padding:0}
.xs-q button.on{background:#2747B8;border-color:#2747B8;color:#fff}
@media(min-width:800px){.xs{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto auto 1fr}.xs-top,.xs-tabs{grid-column:1/-1}.xs-view{grid-column:1}.xs-ans{grid-column:2;max-height:none;border-top:0;border-left:2px solid #1E2A5A}.xs-grid{grid-template-columns:1fr}.xs-q button{height:36px}}

/* ---------- ХӨӨРХӨН ЗАГВАР ---------- */
body{background:linear-gradient(180deg,#E6EEFB 0%,#F3EAF7 60%,#FDF3EC 100%) fixed}
header{position:relative;overflow:hidden;background:linear-gradient(125deg,#3BB6A6 0%,#2E6FD8 60%,#5B4FD6 100%);border-radius:0 0 28px 28px;padding:22px 20px 22px;box-shadow:0 10px 28px rgba(46,111,216,.25)}
header:before,header:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
header:before{width:180px;height:180px;right:-50px;top:-70px}header:after{width:110px;height:110px;right:70px;bottom:-60px;background:rgba(255,255,255,.08)}
header .sub{color:#DDEBFF;position:relative}header .ttl{position:relative;font-size:25px;font-weight:800;margin:4px 0 8px}
#hWho{display:flex;gap:6px;flex-wrap:wrap}.hchip{background:rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:700;backdrop-filter:blur(4px)}
.card{border:0;border-radius:22px;box-shadow:0 4px 18px rgba(60,60,140,.08)}
main>.card:first-child{background:linear-gradient(135deg,#FFFFFF 0%,#F2EEFF 100%)}
.btn{border-radius:14px;background:linear-gradient(110deg,#2E6FD8,#5B4FD6);box-shadow:0 6px 14px rgba(46,111,216,.25);font-weight:700}
.btn.sec{background:#fff;box-shadow:none;border:1.5px solid #C9D6F5;color:#2E6FD8}
.btn.dark{background:#1E2A5A}
.bar{height:12px;background:#E9E6FB}.bar>div{height:12px;background:linear-gradient(90deg,#3BB6A6,#7C6CF0);border-radius:99px}
.pill{font-weight:700}.p-blue{background:#EAF0FF;color:#2E6FD8}.p-green{background:#E2F6EE;color:#14805A}.p-amber{background:#FFF1DF;color:#A0560B}.p-red{background:#FFE8EC;color:#C0394E}
.topic{flex-direction:row;align-items:center;gap:12px;border:0;border-radius:20px;padding:12px 14px;box-shadow:0 4px 14px rgba(60,60,140,.07);position:relative}
.topic .tnum{flex:none;width:48px;height:48px;border-radius:16px;background:var(--tc);color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px;box-shadow:0 6px 12px rgba(0,0,0,.12)}
.topic .tbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.topic .tgo{font-size:26px;color:#B5BCD6;font-weight:300}
.topic.now{box-shadow:0 0 0 2.5px var(--tc),0 8px 20px rgba(60,60,140,.12)}
.link{color:#2E6FD8}
.opt{border-radius:14px}.opt.on{border-color:#5B4FD6;background:#EFEBFF}
.choice button{border-radius:14px}
.xs-top{background:linear-gradient(110deg,#2E6FD8,#5B4FD6)}.xs-tabs>button.on{background:#5B4FD6;border-color:#5B4FD6}.xs-q button.on{background:#5B4FD6;border-color:#5B4FD6}.xs-ah button{background:linear-gradient(110deg,#2E6FD8,#5B4FD6)}
.xs-ans{border-top-color:#5B4FD6}
.buddy{flex:none;cursor:pointer;overflow:visible}.b-star .bb,.b-happy .bb{animation:bbob 2.4s ease-in-out infinite;transform-origin:56px 116px}
.b-sleepy .bb{animation:bsway 3.6s ease-in-out infinite;transform-origin:56px 116px}.b-sad .bb{transform:translateY(3px)}
.bz{animation:bzz 2.2s ease-in-out infinite}.bsp{animation:bsp 1.6s ease-in-out infinite;transform-origin:center}
.buddy.jump .bb{animation:bjump .6s ease}
@keyframes bbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes bsway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bzz{0%{opacity:0;transform:translate(0,4px)}50%{opacity:1}100%{opacity:0;transform:translate(6px,-8px)}}
@keyframes bsp{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes bjump{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-18px) rotate(-8deg)}70%{transform:translateY(0) rotate(6deg)}100%{transform:none}}
.bmsg{font-size:13px;font-weight:700;border-radius:10px;padding:5px 9px;align-self:flex-start}
.bmsg.b-star{background:#FFF3CF;color:#8A5A00}.bmsg.b-happy{background:#E2F6EE;color:#14805A}.bmsg.b-sleepy{background:#FFF1DF;color:#A0560B}.bmsg.b-sad{background:#EEF0F6;color:#4A5170}
@media(prefers-reduced-motion:reduce){.buddy *{animation:none!important}}
.terms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#fff;border-radius:16px;padding:5px;box-shadow:0 4px 14px rgba(60,60,140,.07)}
.terms button{border:0;background:transparent;border-radius:12px;height:44px;font-weight:700;font-size:13.5px;color:#5A6178;position:relative}
.terms button.on{background:linear-gradient(110deg,#2E6FD8,#5B4FD6);color:#fff}
.terms em{font-style:normal;position:absolute;top:2px;right:4px;font-size:10.5px;background:#FF8FB1;color:#fff;border-radius:99px;padding:0 5px;line-height:16px}
.snav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(500px,calc(100% - 20px));z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:22px;padding:6px;box-shadow:0 10px 30px rgba(40,40,110,.18)}
.snav button{border:0;background:transparent;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;color:#7A81A0;font-size:11.5px;font-weight:700;position:relative;min-height:54px}
.snav button.on{background:linear-gradient(110deg,#2E6FD8,#5B4FD6);color:#fff}
.snav em{font-style:normal;position:absolute;top:3px;right:calc(50% - 22px);background:#FF5C7A;color:#fff;font-size:10.5px;border-radius:99px;min-width:18px;line-height:18px;padding:0 4px}
main{padding-bottom:96px!important}
.bswap{border:0;background:#EEF1FF;color:#2E6FD8;font-weight:700;font-size:12px;border-radius:99px;padding:2px 9px;margin-left:2px}
.bpick{position:fixed;inset:0;z-index:95;background:rgba(20,20,60,.45);display:flex;align-items:flex-end;justify-content:center}
.bpc{background:#fff;width:min(520px,100%);border-radius:24px 24px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;animation:bup .25s ease}
@keyframes bup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bgrid button{border:2px solid #E1E4EE;background:#FAFAFE;border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bgrid button.on{border-color:#5B4FD6;background:#F1EEFF}.bgrid .muted{font-size:11px;text-align:center;line-height:1.3}
/* хөдөлгөөн: нүд цавчих, гар даллах, амьсгалах */
.buddy .beyes{transform-box:fill-box;transform-origin:center;animation:bblink 4.2s infinite}
.b-happy .barmr,.b-star .barmr{transform-box:fill-box;transform-origin:0% 50%;animation:bwave 2.2s ease-in-out infinite}
.b-star .barml{transform-box:fill-box;transform-origin:100% 50%;animation:bwave2 2.2s ease-in-out infinite}
.b-sleepy .bb{animation:bbreath 3.4s ease-in-out infinite!important;transform-origin:56px 116px}
.b-happy .bb,.b-star .bb{animation:bsquash 2.4s ease-in-out infinite!important;transform-origin:56px 118px}
.b-sleepy .beyes,.b-sad .beyes{animation:none}
@keyframes bblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes bwave{0%,100%{transform:rotate(0)}25%{transform:rotate(-28deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-20deg)}}
@keyframes bwave2{0%,100%{transform:rotate(0)}50%{transform:rotate(24deg)}}
@keyframes bbreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes bsquash{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-5px) scale(.97,1.03)}55%{transform:translateY(0) scale(1.04,.96)}70%{transform:scale(1,1)}}
.bheart{position:fixed;z-index:120;font-size:22px;pointer-events:none;animation:bfly 1.2s ease-out forwards}
@keyframes bfly{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1;transform:translateY(-10px) scale(1.1)}100%{opacity:0;transform:translateY(-90px) scale(.9) rotate(15deg)}}
.bagg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bi{border:0;border-radius:14px;background:#F1F3F9;aspect-ratio:1/1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px}
.bi span{font-size:24px;filter:grayscale(1) opacity(.35)}.bi small{font-size:9.5px;font-weight:700;color:#7A81A0;line-height:1.1;text-align:center}
.bi.got{background:linear-gradient(160deg,#FFF6D8,#FFE3EE);box-shadow:inset 0 0 0 1.5px #FFD27A}.bi.got span{filter:none;animation:bipop .5s ease}
@keyframes bipop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.bagpop{position:fixed;inset:0;z-index:130;background:rgba(20,20,60,.5);display:flex;align-items:center;justify-content:center;overflow:hidden}
.bagc{background:#fff;border-radius:26px;padding:24px 22px;width:min(320px,86%);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;animation:bup .3s ease}
.bagbig{font-size:72px;animation:bspin 1s ease}
@keyframes bspin{0%{transform:scale(.2) rotate(-40deg)}60%{transform:scale(1.25) rotate(10deg)}100%{transform:none}}
.conf{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;animation:cfall 1.8s ease-in forwards}
@keyframes cfall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="sub" id="hSub">EduSolveMN</div>
    <div class="ttl" id="hTitle">Ангийн самбар</div>
    <div class="sub" id="hWho"></div>
  </header>
  <main id="app"><div class="muted">Ачаалж байна…</div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  var C = window.APP_CONFIG;
  var sb = window.supabase.createClient(C.url, C.key, { auth: { persistSession: false } });
  var app = document.getElementById('app');
  var params = new URLSearchParams(location.search);
  var cls = params.get('c') || localStorage.getItem('cls') || '';
  var preCode = params.get('s') || '';
  if (cls) { try { localStorage.setItem('cls', cls); } catch (e) {} }
  var token = null; try { token = localStorage.getItem('tok'); } catch (e) {}
  var home = null, curTopic = null, info = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    var gal = document.getElementById('gal');
    if (MAX === 1) gal.removeAttribute('multiple');
    var full = function () { toast('Энэ сэдэвт ' + MAX + ' зураг илгээнэ. Солих бол ✕ дарж хасна уу.'); };
    document.getElementById('take').onclick = function () { if (photos.length >= MAX) { full(); return; } cam.click(); };
    document.getElementById('pick').onclick = function () { if (photos.length >= MAX) { full(); return; } gal.click(); };
    function addFiles(list) {
      var all = Array.prototype.slice.call(list || []), fs = all.slice(0, MAX - photos.length);
      if (all.length > fs.length) full();
      fs.reduce(function (pr, f) { return pr.then(function () { return shrink(f).then(function (p) { photos.push(p); drawPh(); }); }); }, Promise.resolve())
        .catch(function () { toast('Зураг уншиж чадсангүй'); });
    }
    cam.onchange = function () { addFiles(cam.files); cam.value = ''; };
    gal.onchange = function () { addFiles(gal.files); gal.value = ''; };
    function drawPh() {
      var el = document.getElementById('ph');
      el.innerHTML = photos.length ? '<div class="muted" style="margin-bottom:6px"><b>' + photos.length + ' / ' + MAX + ' зураг</b> бэлэн · ✕ дарж хасна</div><div class="strip">' +
        photos.map(function (p, i) { return '<div class="ph"><img alt="" src="' + p.preview + '"><span class="no">' + (i + 1) + '</span><button class="x" data-rm="' + i + '" aria-label="Хасах">✕</button></div>'; }).join('') + '</div>' : '';
      var pend = photos.map(function (p, i) { return p.codeOk ? '' : '<div class="card" style="border:2px solid #2747B8;gap:10px"><b style="font-size:16px">' + (i + 1) + '-р зураг: зүүн доод буланд таны код <span style="color:#2747B8">' + esc(myCode) + '</span> тод харагдаж байна уу?</b>' +
        '<img alt="Зургийн зүүн доод булан" src="' + p.corner + '" style="width:100%;border-radius:10px;border:1px solid #C5CADB;background:#fff">' +
        '<div class="choice"><button data-cy="' + i + '">Тийм, харагдаж байна</button><button data-cn="' + i + '">Үгүй, код алга</button></div></div>'; }).join('');
      if (pend) el.insertAdjacentHTML('beforeend', pend);
      el.querySelectorAll('[data-cy]').forEach(function (b) { b.onclick = function () { photos[+b.dataset.cy].codeOk = true; drawPh(); }; });
      el.querySelectorAll('[data-cn]').forEach(function (b) { b.onclick = function () {
        photos.splice(+b.dataset.cn, 1); drawPh();
        document.getElementById('err').textContent = 'Код алга. Дэвтрийнхээ зүүн доод буланд ' + myCode + ' гэж үзгээр тод бичээд, дахин зураг авна уу.';
      }; });
      el.querySelectorAll('[data-rm]').forEach(function (b) { b.onclick = function () { photos.splice(+b.dataset.rm, 1); drawPh(); }; });
      var stp = el.querySelector('.strip'); if (stp) { stripArrows(stp); stp.scrollLeft = stp.scrollWidth; }
    }
    var yes = document.getElementById('yes'), no = document.getElementById('no');
    yes.onclick = function () { claim = true; yes.className = 'on'; no.className = ''; };
    no.onclick = function () { claim = false; no.className = 'on2'; yes.className = ''; };
    document.getElementById('go').onclick = function () {
      var err = document.getElementById('err'), b = this;
      if (!photos.length) { err.textContent = 'Эхлээд зургаа авна уу.'; return; }
      if (photos.some(function (p) { return !p.codeOk; })) { err.textContent = 'Зураг бүрийн зүүн доод буланд ' + myCode + ' код харагдаж байгааг шалгаад "Тийм" дарна уу.'; return; }
      if (claim === null) { err.textContent = 'Багшид үзүүлсэн эсэхээ сонгоно уу.'; return; }
      b.disabled = true; b.textContent = 'Илгээж байна…';
      Promise.resolve().then(function () {
        var uploads = photos.map(function (p, i) {
          var path = t.id + '/' + home.sid + '/' + Date.now() + '-' + i + '.jpg';
          return sb.storage.from('submissions').upload(path, p.blob, { contentType: 'image/jpeg', upsert: false }).then(function (r) { if (r.error) throw r.error; return path; });
        });
        return Promise.all(uploads);
      }).then(function (paths) {
        sentPaths = paths;
        return sb.rpc('student_submit', { p_token: token, p_lesson: t.id, p_paths: paths, p_hashes: photos.map(function (p) { return p.hash; }), p_claimed: claim });
      }).then(function (r) {
        if (r.error) throw r.error;
        try { sentPaths.forEach(function (pth, i) { localStorage.setItem('pp_' + pth, photos[i].preview); }); } catch (e) {}
        var auto = r.data && r.data.status === 'auto';
        loadHome(function () {
          curTopic = home.topics.filter(function (x) { return x.id === t.id; })[0] || t;
          app.innerHTML = '<div class="card" style="align-items:center;text-align:center;padding:28px 18px">' +
            '<svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Амжилттай"><circle cx="32" cy="32" r="30" fill="#E3F4EA"/><path d="M20 33 L28 41 L45 24" fill="none" stroke="#1C6B40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '<h1>Багшид амжилттай илгээгдлээ ✓</h1><div style="font-size:16px;font-weight:600">' + sentPaths.length + ' зураг</div><div class="muted">' + (auto ? '+20 оноо! Журналд автоматаар орлоо.' : 'Багш шалгаад журналд оруулна.') + ' Санаа зоволтгүй, дахин илгээх шаардлагагүй.</div>' +
            '<button class="btn" id="ok">Сэдэв рүү буцах</button></div>';
          document.getElementById('ok').onclick = showTopic;
        });
      }).catch(function (e) {
        b.disabled = false; b.textContent = 'Илгээх';
        err.textContent = /already sent/.test((e && e.message) || '') ? 'Энэ сэдэвт аль хэдийн илгээсэн байна. Дахин илгээх шаардлагагүй.' : /too many photos/.test((e && e.message) || '') ? 'Энэ сэдэвт ' + MAX + ' зураг л илгээнэ.' : 'Илгээж чадсангүй. Интернэтээ шалгаад дахин оролдоно уу.';
        console.error(e);
      });
    };
  }

  // ---------- TEST ----------
  // ---------- ШАЛГАЛТЫН ДЭЛГЭЦ: том хуудас + жижиг хариулт ----------
  function examSplit(o) {
    // o: { title, files[], n, labels[], until, draw[], onBack, onSubmit(ans, photos, btn, err) }
    var ans = {}, cur = 0, zoom = 1, ph = {}, files = (o.files || []).filter(function (u) { return !/\.pdf(\?|$)/i.test(u); }), pdfs = (o.files || []).filter(function (u) { return /\.pdf(\?|$)/i.test(u); });
    var draw = o.draw || [], tabs = files.map(function (_, i) { return { k: 'p' + i, t: 'Хуудас ' + (i + 1) }; }).concat(draw.map(function (_, i) { return { k: 'd' + i, t: '✏️ Зураг ' + (i + 1) }; }));
    if (!tabs.length && pdfs.length) tabs.push({ k: 'pdf', t: 'PDF' });
    var ov = document.createElement('div'); ov.className = 'xs'; document.body.appendChild(ov); document.body.style.overflow = 'hidden';
    function close() { ov.remove(); document.body.style.overflow = ''; }
    function shrinkPh(f) { return new Promise(function (res) { var u = URL.createObjectURL(f), im = new Image(); im.onload = function () { var k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(function (bl) { res({ blob: bl, url: URL.createObjectURL(bl) }); }, 'image/jpeg', 0.85); }; im.onerror = function () { res(null); }; im.src = u; }); }
    function viewHtml() {
      var tb = tabs[cur]; if (!tb) return '<div class="muted" style="padding:20px">Тестийн хуудсыг багш тараана.</div>';
      if (tb.k === 'pdf') return pdfs.map(function (u, i) { return '<a class="btn sec" style="margin:12px" target="_blank" rel="noopener" href="' + esc(u) + '">PDF ' + (i + 1) + ' нээх ↗</a>'; }).join('');
      if (tb.k[0] === 'p') return '<img alt="' + tb.t + '" src="' + esc(files[+tb.k.slice(1)]) + '" style="width:' + (zoom * 100) + '%">';
      var i = +tb.k.slice(1), d = draw[i], my = ph[i] || [];
      return '<div class="xs-draw"><b>' + (i + 1) + '-р зургийн даалгавар · ' + (d.points || 0) + ' оноо</b><div style="white-space:pre-wrap;line-height:1.5">' + esc(d.text || '') + '</div>' + (d.img ? '<img alt="" src="' + esc(d.img) + '" style="width:100%;border-radius:10px">' : '') +
        '<div class="xs-tip">Дэвтэр дээрээ байгуулаад, <b>зүүн доод буланд ' + esc(home.code || '') + '</b> кодоо бичнэ. Дараа нь зургаа авна.</div>' +
        '<div class="xs-ph">' + my.map(function (p, j) { return '<div><img alt="" src="' + p.url + '"><button type="button" data-phx="' + j + '" aria-label="Хасах">✕</button></div>'; }).join('') +
        (my.length < 3 ? '<label class="xs-cam">📷 Зураг авах<input type="file" accept="image/*" capture="environment" data-phin hidden></label><label class="xs-cam">🖼 Цомгоос<input type="file" accept="image/*" data-phin hidden></label>' : '') + '</div></div>';
    }
    function render() {
      var nA = Object.keys(ans).length, isPage = tabs[cur] && tabs[cur].k[0] === 'p';
      ov.innerHTML = '<div class="xs-top"><button type="button" id="xsBack">← Гарах</button><b>' + esc(o.title) + '</b>' + (o.until ? '<span class="xs-tm" id="xsTm"></span>' : '') + '</div>' +
        '<div class="xs-tabs">' + tabs.map(function (t, i) { return '<button type="button" data-tab="' + i + '" class="' + (i === cur ? 'on' : '') + (t.k[0] === 'd' && (ph[+t.k.slice(1)] || []).length ? ' ok' : '') + '">' + t.t + '</button>'; }).join('') + (isPage ? '<span class="xs-z"><button type="button" data-zz="-1" aria-label="Жижигрүүлэх">−</button><button type="button" data-zz="1" aria-label="Томруулах">+</button></span>' : '') + '</div>' +
        '<div class="xs-view" id="xsView">' + viewHtml() + '</div>' +
        '<div class="xs-ans"><div class="xs-ah"><b>Хариулт</b><span>' + nA + ' / ' + o.n + '</span>' + (draw.length ? '<span>· зураг ' + draw.filter(function (_, i) { return (ph[i] || []).length; }).length + '/' + draw.length + '</span>' : '') + '<button type="button" id="xsFin">Илгээх</button></div><div class="err" id="xsErr"></div>' +
        '<div class="xs-grid">' + Array.apply(null, { length: o.n }).map(function (_, i) { return '<div class="xs-q"><i>' + (i + 1) + '</i>' + o.labels.map(function (l, j) { return '<button type="button" data-q="' + i + '" data-o="' + j + '" class="' + (ans[i] === j ? 'on' : '') + '">' + l + '</button>'; }).join('') + '</div>'; }).join('') + '</div></div>';
      bind();
    }
    function bind() {
      ov.querySelector('#xsBack').onclick = function () { var b = this; if (!b.dataset.sure && (Object.keys(ans).length || Object.keys(ph).length)) { b.dataset.sure = 1; b.textContent = 'Гарах уу? Хариулт устна'; return; } close(); o.onBack(); };
      ov.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { cur = +b.dataset.tab; render(); ov.querySelector('#xsView').scrollTop = 0; }; });
      ov.querySelectorAll('[data-zz]').forEach(function (b) { b.onclick = function () { zoom = Math.max(1, Math.min(3, zoom + 0.5 * +b.dataset.zz)); var im = ov.querySelector('#xsView img'); if (im) im.style.width = (zoom * 100) + '%'; }; });
      ov.querySelectorAll('.xs-grid [data-q]').forEach(function (b) { b.onclick = function () { ans[b.dataset.q] = +b.dataset.o; ov.querySelectorAll('.xs-grid [data-q="' + b.dataset.q + '"]').forEach(function (x) { x.classList.toggle('on', x === b); }); ov.querySelector('.xs-ah span').textContent = Object.keys(ans).length + ' / ' + o.n; }; });
      ov.querySelectorAll('[data-phin]').forEach(function (inp) { inp.onchange = function () { var f = this.files[0]; if (!f) return; var i = +tabs[cur].k.slice(1); shrinkPh(f).then(function (p) { if (!p) return; (ph[i] = ph[i] || []).push(p); render(); }); }; });
      ov.querySelectorAll('[data-phx]').forEach(function (b) { b.onclick = function () { var i = +tabs[cur].k.slice(1); ph[i].splice(+b.dataset.phx, 1); if (!ph[i].length) delete ph[i]; render(); }; });
      ov.querySelector('#xsFin').onclick = function () {
        var err = ov.querySelector('#xsErr'), b = this, miss = [];
        for (var i = 0; i < o.n; i++) if (ans[i] == null) miss.push(i + 1);
        var dm = draw.map(function (_, i) { return (ph[i] || []).length ? 0 : i + 1; }).filter(Boolean);
        if ((miss.length || dm.length) && !b.dataset.sure) { b.dataset.sure = 1; err.textContent = (miss.length ? 'Хариулаагүй: ' + miss.join(', ') + '. ' : '') + (dm.length ? 'Зураг илгээгээгүй: ' + dm.join(', ') + '. ' : '') + 'Ингээд илгээх бол дахин дарна.'; return; }
        b.disabled = true; b.textContent = 'Илгээж байна…';
        o.onSubmit(ans, ph, b, err, close);
      };
      if (o.until) { var tm = ov.querySelector('#xsTm'), tick = function () { if (!document.body.contains(tm)) return; var ms = new Date(o.until) - Date.now(); if (ms <= 0) { tm.textContent = '⏰ Дууслаа'; tm.className = 'xs-tm end'; return; } tm.textContent = '⏱ ' + Math.floor(ms / 60000) + ':' + String(Math.floor(ms / 1000) % 60).padStart(2, '0'); if (ms < 300000) tm.className = 'xs-tm end'; clearTimeout(ov._t); ov._t = setTimeout(tick, 1000); }; tick(); }
    }
    render();
  }
  function showFileTest(t, d) {
    var L = (d.labels === 'cyr' ? 'АБВГДЕ' : 'abcdef').slice(0, d.opts || 4).split('');
    examSplit({ title: 'Тест · ' + t.title, files: d.files, n: d.n, labels: L, until: t.test_until, draw: [], onBack: showTopic,
      onSubmit: function (ans, ph, b, err, close) {
        sb.rpc('student_finish_test', { p_token: token, p_lesson: t.id, p_answers: ans }).then(function (r) {
          var d2 = r.data || {}; close();
          if (d2.error) { toast(d2.error === 'done' ? 'Та тест өгсөн байна' : 'Тест хаагдсан байна'); }
          loadHome(function () {
            curTopic = home.topics.filter(function (x) { return x.id === t.id; })[0] || t;
            app.innerHTML = '<div class="card" style="align-items:center;text-align:center;padding:28px 18px"><h1>Таны дүн: ' + (d2.score != null ? d2.score + '/' + d2.total : '—') + '</h1>' +
              '<div class="muted">Дүн багшийн журналд автоматаар бүртгэгдлээ.</div><button class="btn" id="ok">Сэдэв рүү буцах</button></div>';
            document.getElementById('ok').onclick = showTopic;
          });
        });
      } });
  }
  function runTimer() { var tt = app.querySelector('.ttimer'); if (!tt) return; var tick = function () { if (!document.body.contains(tt)) return; var ms = new Date(tt.dataset.until) - Date.now(); if (ms <= 0) { tt.textContent = '⏰ Хугацаа дууссан · одоо илгээнэ үү'; tt.classList.add('end'); return; } var m = Math.floor(ms / 60000), sx = Math.floor(ms / 1000) % 60; tt.textContent = '⏱ ' + m + ':' + String(sx).padStart(2, '0') + ' үлдсэн'; if (ms < 5 * 60000) tt.classList.add('end'); setTimeout(tick, 1000); }; tick(); }
  function showTest() {
    var t = curTopic;
    app.innerHTML = '<div class="muted">Тест ачаалж байна…</div>';
    sb.rpc('student_test', { p_token: token, p_lesson: t.id }).then(function (r) {
      var d = r.data || {};
      if (d.error) { toast(d.error === 'done' ? 'Та тест өгсөн байна' : 'Тест хаагдсан байна'); loadHome(function () { showTopic(); }); return; }
      if (d.mode === 'file') { showFileTest(t, d); return; }
      var qs = d.questions || [], ans = {};
      var html = '<button class="link" id="back">← Буцах</button><h1>Тест · ' + esc(t.title) + '</h1>' + (t.test_until ? '<div class="ttimer" data-until="' + esc(t.test_until) + '"></div>' : '');
      qs.forEach(function (q, i) {
        html += '<div class="card"><b style="line-height:1.4">' + (i + 1) + '. ' + esc(q.q) + '</b>' + (q.img ? '<img alt="" src="' + esc(q.img) + '" style="width:100%;border-radius:8px">' : '') +
          (q.opts || []).map(function (o, j) { return '<button class="opt" data-q="' + i + '" data-o="' + j + '">' + esc(o) + '</button>'; }).join('') + '</div>';
      });
      html += '<div class="err" id="err"></div><button class="btn" id="fin">Илгээх</button>';
      app.innerHTML = html;
      document.getElementById('back').onclick = showTopic;
      runTimer();
      app.querySelectorAll('.opt').forEach(function (b) {
        b.onclick = function () {
          ans[b.dataset.q] = +b.dataset.o;
          app.querySelectorAll('.opt[data-q="' + b.dataset.q + '"]').forEach(function (x) { x.classList.toggle('on', x === b); });
        };
      });
      document.getElementById('fin').onclick = function () {
        if (Object.keys(ans).length < qs.length) { document.getElementById('err').textContent = 'Бүх асуултад хариулна уу.'; return; }
        this.disabled = true;
        sb.rpc('student_finish_test', { p_token: token, p_lesson: t.id, p_answers: ans }).then(function (r) {
          var d2 = r.data || {};
          loadHome(function () {
            curTopic = home.topics.filter(function (x) { return x.id === t.id; })[0] || t;
            app.innerHTML = '<div class="card" style="align-items:center;text-align:center;padding:28px 18px"><h1>Таны дүн: ' + (d2.score != null ? d2.score + '/' + d2.total : '—') + '</h1>' +
              '<div class="muted">Дүн багшийн журналд автоматаар бүртгэгдлээ.</div><button class="btn" id="ok">Сэдэв рүү буцах</button></div>';
            document.getElementById('ok').onclick = showTopic;
          });
        });
      };
      window.scrollTo(0, 0);
    });
  }

  if (cls) sb.rpc('class_info', { p_class: cls }).then(function (r) { if (r.data) { info = r.data; setHeader(); } });
  var autoPin = params.get('p');
  if (preCode && autoPin) {
    try { history.replaceState(null, '', location.pathname + '?c=' + encodeURIComponent(cls)); } catch (e) {}
    app.innerHTML = '<div class="muted">Нэвтэрч байна…</div>';
    sb.rpc('student_login', { p_code: preCode, p_pin: autoPin, p_class: cls }).then(function (r) {
      var d = r.data || {};
      if (d.token) { token = d.token; try { localStorage.setItem('tok', token); } catch (e) {} loadHome(); }
      else showLogin(d.error === 'locked' ? 'Олон удаа буруу оролдсон. 15 минутын дараа дахин оролдоно уу.' : 'Энэ QR хуучирсан байна. Багшаасаа шинэ карт аваарай.');
    });
  } else if (token) loadHome(); else showLogin();
})();
</script>
