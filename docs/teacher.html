<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduSolveMN · Багшийн хэсэг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F6FA;font-family:Inter,system-ui,sans-serif;color:#1A1F36}
button,input,select,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer}
header{background:#1E2A5A;color:#fff;padding:16px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header .sub{font-size:13px;color:#C9D1F0}
header h1{margin:2px 0 0;font-size:22px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{height:42px;padding:0 16px;border-radius:99px;border:1.5px solid #fff;background:transparent;color:#fff;font-weight:600}
nav.tabs button.on{background:#fff;color:#1E2A5A}
main{max-width:1200px;margin:0 auto;padding:20px 24px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid #E1E4EE;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
h2{margin:0;font-size:18px}h3{margin:0;font-size:16px}
.muted{color:#5A6178;font-size:13px;line-height:1.5}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=number],select,textarea{height:44px;border:1px solid #C5CADB;border-radius:10px;padding:0 12px;background:#fff;color:#1A1F36}
textarea{height:auto;min-height:120px;padding:10px 12px;resize:vertical;width:100%}
.btn{height:44px;padding:0 16px;border:0;border-radius:10px;background:#2747B8;color:#fff;font-weight:600}
.btn.sec{background:#fff;color:#2747B8;border:1.5px solid #2747B8}
.btn.ghost{background:#fff;color:#1A1F36;border:1px solid #C5CADB}
.btn.green{background:#1C7C4A}.btn.amber{background:#fff;color:#8A4B0B;border:1px solid #F2C89A}.btn.red{background:#fff;color:#A12A1E;border:1px solid #E9B4AE}
.btn.dark{background:#1E2A5A}
.btn:disabled{opacity:.5}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid #C5CADB;background:#fff;font-weight:600;color:#1A1F36}
.chip.on{background:#1E2A5A;border-color:#1E2A5A;color:#fff}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px}
.p-red{background:#FDECEA;color:#A12A1E}.p-green{background:#E3F4EA;color:#1C6B40}.p-blue{background:#EEF1FA;color:#2747B8}.p-amber{background:#FFF3E5;color:#8A4B0B}
.photos{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;min-height:150px}
.photos img{flex:0 0 auto;width:118px;height:150px;object-fit:cover;border-radius:8px;border:1px solid #C5CADB;cursor:zoom-in;scroll-snap-align:start;background:#E9ECF6}
.zx{position:fixed;top:14px;right:14px;height:48px;padding:0 18px;border-radius:99px;border:0;background:#fff;color:#1A1F36;font-size:16px;font-weight:700;cursor:pointer;z-index:32;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.zbtn{position:fixed;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:24px;font-weight:700;cursor:pointer;z-index:31}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #EEF0F5}
th{font-size:12px;color:#5A6178}
.tablebox{overflow-x:auto}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.names button{min-height:54px;text-align:left;border-radius:10px;border:1.5px solid #D5DAE8;background:#fff;padding:8px 10px;position:relative;color:#1A1F36}
.names button.on{background:#2747B8;color:#fff;border-color:#2747B8}
.badge{position:absolute;top:6px;right:6px;background:#C2410C;color:#fff;border-radius:99px;font-size:11px;min-width:20px;height:20px;line-height:20px;text-align:center}
.sticky{position:sticky;bottom:0;background:#fff;border-top:2px solid #2747B8;padding:12px;border-radius:12px 12px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.06)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1A1F36;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:20}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:30}
.zoom img{max-width:96vw;max-height:94vh}
#print{display:none}
@media print{
  body{background:#fff} header,main,.toast,.credit{display:none!important}
  #print{display:block}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .pc{border:1px dashed #888;padding:12px;display:flex;gap:10px;align-items:center;break-inside:avoid;height:46mm}
  .pc b{font-size:15px}.pc div{font-size:13px}
}
</style>
</head>
<body>
<header>
  <div><div class="sub" id="who">Багшийн хэсэг</div><h1 id="tTitle">EduSolveMN · Багшийн самбар</h1></div>
  <nav class="tabs" id="tabs" hidden></nav>
</header>
<main id="app"><div class="muted">Ачаалж байна…</div></main>
<div id="print"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script>
(function () {
  var C = window.APP_CONFIG;
  var sb = window.supabase.createClient(C.url, C.key);
  var app = document.getElementById('app'), tabsEl = document.getElementById('tabs');
  var me = null, T = { name: '', subject: '', school: '' }, isOwner = false, classes = [], tab = 'review';
  var KIND = { no_notebook: 'Дэвтэргүй', no_supplies: 'Хэрэглэгдэхүүнгүй', phone: 'Утас', sleep: 'Унтсан', talk: 'Ярьсан', disrupt: 'Саад', late: 'Хоцорсон' };
  var STUDENT_URL = new URL('index.html', location.href).href;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3000); }
  function fmt(d) { var x = new Date(d); return (x.getMonth() + 1) + '/' + x.getDate() + ' ' + String(x.getHours()).padStart(2, '0') + ':' + String(x.getMinutes()).padStart(2, '0'); }
  function q(sel) { return app.querySelector(sel); }
  function fail(r) { if (r && r.error) { toast('Алдаа: ' + r.error.message); console.error(r.error); return true; } return false; }

  // ---------- AUTH ----------
  function phEmail(v) { return 'p' + String(v || '').replace(/\D/g, '') + '@edusolve.mn'; }
  function showAuth(msg) {
    tabsEl.hidden = true;
    app.innerHTML = '<div class="card" style="max-width:420px;margin:30px auto;display:flex;flex-direction:column;gap:8px"><h2>Багшаар нэвтрэх</h2>' +
      '<div id="byPhone" style="display:flex;flex-direction:column;gap:8px">' +
      '<label class="muted" for="ph">Утасны дугаар</label><input id="ph" type="tel" inputmode="numeric" autocomplete="tel" placeholder="99112233" maxlength="8">' +
      '<label class="muted" for="pin">PIN код (6 оронтой тоо)</label><div class="row" style="flex-wrap:nowrap"><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" style="flex:1;min-width:0"><button class="btn ghost" id="eye" type="button" aria-pressed="false">Харах</button></div></div>' +
      '<div id="byEmail" hidden style="display:flex;flex-direction:column;gap:8px">' +
      '<label class="muted" for="em">Имэйл</label><input id="em" type="email" autocomplete="email">' +
      '<label class="muted" for="pw">Нууц үг</label><input id="pw" type="password" autocomplete="current-password"></div>' +
      '<div class="muted" id="msg" style="color:#B42318">' + esc(msg || '') + '</div>' +
      '<button class="btn" id="in">Нэвтрэх</button>' +
      '<details id="reg" style="margin-top:6px"><summary class="muted" style="cursor:pointer">Анх удаа бүртгүүлэх бол энд дарна уу</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">' +
      '<div class="muted">Дээр утасны дугаараа бичээд өөрөө санахад амар 6 оронтой PIN зохиож оруулна уу. Дараа нь доорхыг бөглөнө.</div>' +
      '<label class="muted" for="rn">Нэр (жишээ: Г.Даваасүрэн)</label><input type="text" id="rn" autocomplete="name">' +
      '<label class="muted" for="rs">Хичээл</label><input type="text" id="rs" placeholder="Зураг зүй">' +
      '<label class="muted" for="rsc">Сургууль</label><input type="text" id="rsc" placeholder="21-р сургууль">' +
      '<label class="muted" for="ri">Урилгын код</label><input type="text" id="ri" autocomplete="off">' +
      '<button class="btn ghost" id="up">Бүртгүүлэх</button></div></details>' +
      '<div class="muted" style="font-size:13px">PIN-ээ мартсан бол платформын эзэнд хэлээрэй. · <a href="#" id="sw">Имэйлээр нэвтрэх</a></div></div>';
    var emailMode = false;
    q('#sw').onclick = function (e) {
      e.preventDefault(); emailMode = !emailMode;
      q('#byPhone').hidden = emailMode; q('#byEmail').hidden = !emailMode; q('#byEmail').style.display = emailMode ? 'flex' : 'none';
      q('#reg').hidden = emailMode; this.textContent = emailMode ? 'Утсаар нэвтрэх' : 'Имэйлээр нэвтрэх'; q('#msg').textContent = '';
    };
    q('#byEmail').style.display = 'none';
    q('#eye').onclick = function () { var p = q('#pin'), show = p.type === 'password'; p.type = show ? 'text' : 'password'; this.textContent = show ? 'Нуух' : 'Харах'; this.setAttribute('aria-pressed', show); };
    var phone = function () { return q('#ph').value.replace(/\D/g, ''); };
    q('#in').onclick = function () {
      var cred;
      if (emailMode) cred = { email: q('#em').value.trim(), password: q('#pw').value };
      else {
        if (phone().length !== 8) { q('#msg').textContent = 'Утасны дугаараа 8 оронтойгоор бичнэ үү.'; return; }
        if (!/^\d{6}$/.test(q('#pin').value)) { q('#msg').textContent = 'PIN 6 оронтой тоо байна.'; return; }
        cred = { email: phEmail(phone()), password: q('#pin').value };
      }
      q('#msg').textContent = '';
      sb.auth.signInWithPassword(cred).then(function (r) {
        if (r.error) q('#msg').textContent = /rate|seconds/i.test(r.error.message) ? mnErr(r.error.message) : (emailMode ? 'Имэйл эсвэл нууц үг буруу байна.' : 'Утасны дугаар эсвэл PIN буруу байна. Бүртгүүлээгүй бол доорх «Анх удаа бүртгүүлэх»-ийг дарна уу.');
        else boot();
      });
    };
    q('#up').onclick = function () {
      var d = { name: q('#rn').value.trim(), subject: q('#rs').value.trim(), school: q('#rsc').value.trim(), invite: q('#ri').value.trim() };
      if (phone().length !== 8) { q('#msg').textContent = 'Дээр утасны дугаараа 8 оронтойгоор бичнэ үү.'; return; }
      if (!/^\d{6}$/.test(q('#pin').value)) { q('#msg').textContent = 'Дээр 6 оронтой PIN зохиож бичнэ үү.'; return; }
      if (!d.name || !d.subject || !d.invite) { q('#msg').textContent = 'Нэр, хичээл, урилгын кодоо бөглөнө үү.'; return; }
      var btn = this; btn.disabled = true;
      sb.rpc('register_teacher_phone', { p_phone: phone(), p_pin: q('#pin').value, p_name: d.name, p_subject: d.subject, p_school: d.school, p_invite: d.invite }).then(function (r) {
        var m = { pin: '111111, 123456 шиг хэт амархан PIN болохгүй. Өөр 6 оронтой тоо сонгоно уу.', phone: 'Утасны дугаар 8 оронтой байна.', name: 'Нэрээ бичнэ үү.',
          exists: 'Энэ дугаар бүртгэлтэй байна. «Нэвтрэх» товчийг дарна уу.', invite: 'Урилгын код буруу эсвэл хэрэглэгдэж дууссан байна.' };
        if (r.error || r.data !== 'ok') { btn.disabled = false; q('#msg').textContent = r.error ? mnErr(r.error.message) : (m[r.data] || 'Алдаа гарлаа.'); return; }
        sb.auth.signInWithPassword({ email: phEmail(phone()), password: q('#pin').value }).then(function (r2) {
          btn.disabled = false; if (r2.error) q('#msg').textContent = mnErr(r2.error.message); else boot();
        });
      });
    };
  }

  function mnErr(m) {
    var t = String(m || '');
    var sec = t.match(/(\d+)\s*seconds?/i);
    if (sec) return sec[1] + ' секундын дараа дахин оролдоно уу.';
    if (/already registered|already exists/i.test(t)) return 'Энэ имэйл бүртгэлтэй байна. Дээрх «Нэвтрэх» товчийг дарна уу.';
    if (/invalid login|invalid credentials/i.test(t)) return 'Имэйл эсвэл нууц үг буруу байна.';
    if (/invalid.*email|email.*invalid/i.test(t)) return 'Имэйл хаяг буруу байна.';
    return 'Алдаа гарлаа: ' + t;
  }
  function boot() {
    sb.auth.getSession().then(function (r) {
      var s = r.data.session; if (!s) { showAuth(); return; }
      var pend = {}; try { pend = JSON.parse(localStorage.getItem('pendingT') || '{}'); } catch (e) {}
      sb.rpc('claim_teacher', { p_name: pend.name || '', p_subject: pend.subject || '', p_school: pend.school || '', p_invite: pend.invite || '' }).then(function (c) {
        if (c.data !== true) {
          app.innerHTML = '<div class="card" style="display:flex;flex-direction:column;gap:8px"><h2>Бүртгэлээ дуусгана уу</h2><div class="muted">Нэр, хичээл, урилгын кодоо оруулаад «Идэвхжүүлэх» дарна уу.</div>' +
            '<label class="muted" for="an">Нэр (жишээ: Г.Даваасүрэн)</label><input type="text" id="an" value="' + esc(pend.name || '') + '">' +
            '<label class="muted" for="as">Хичээл</label><input type="text" id="as" value="' + esc(pend.subject || '') + '">' +
            '<label class="muted" for="asc">Сургууль</label><input type="text" id="asc" value="' + esc(pend.school || '') + '">' +
            '<label class="muted" for="ai">Урилгын код</label><input type="text" id="ai" autocomplete="off" value="' + esc(pend.invite || '') + '">' +
            '<div class="muted" id="amsg" style="color:#B42318"></div><button class="btn" id="act">Идэвхжүүлэх</button><button class="btn ghost" id="lo">Гарах</button></div>';
          q('#act').onclick = function () {
            var d = { name: q('#an').value.trim(), subject: q('#as').value.trim(), school: q('#asc').value.trim(), invite: q('#ai').value.trim() };
            if (!d.name || !d.subject || !d.invite) { q('#amsg').textContent = 'Нэр, хичээл, урилгын кодоо бөглөнө үү.'; return; }
            sb.rpc('claim_teacher', { p_name: d.name, p_subject: d.subject, p_school: d.school, p_invite: d.invite }).then(function (c2) {
              if (c2.data === true) boot(); else q('#amsg').textContent = 'Урилгын код буруу эсвэл хэрэглэгдэж дууссан байна.';
            });
          };
          q('#lo').onclick = function () { sb.auth.signOut().then(function () { showAuth(); }); }; return;
        }
        try { localStorage.removeItem('pendingT'); } catch (e) {}
        me = s.user; var _em = me.email || ''; document.getElementById('who').textContent = /^p\d{8}@edusolve\.mn$/.test(_em) ? _em.slice(1, 9) : _em;
        sb.from('teachers').select('name,subject,school').eq('id', me.id).maybeSingle().then(function (tr) {
          if (tr.data) T = tr.data;
          document.getElementById('tTitle').textContent = (T.subject || 'EduSolveMN') + ' · ' + (T.name || '') + ' багшийн самбар';
          document.title = 'EduSolveMN · ' + (T.name || 'Багшийн хэсэг');
          cleanupPhotos();
          sb.rpc('owner_overview').then(function (o) {
            isOwner = !!(o.data && o.data.owner);
            loadClasses().then(function () { drawTabs(); go('review'); });
          });
        });
      });
    });
  }
  function loadClasses() { return sb.from('classes').select('*').order('name').then(function (r) { classes = r.data || []; }); }
  function cleanupPhotos() {
    var cut = new Date(Date.now() - 30 * 864e5).toISOString();
    sb.from('submissions').select('id,photo_paths').in('status', ['ok', 'auto']).lt('created_at', cut).neq('photo_paths', '{}').limit(500).then(function (r) {
      var rows = r.data || []; if (!rows.length) return;
      var paths = []; rows.forEach(function (x) { paths = paths.concat(x.photo_paths || []); });
      sb.storage.from('submissions').remove(paths).then(function (d) {
        if (d.error) return;
        sb.from('submissions').update({ photo_paths: [], image_hashes: [] }).in('id', rows.map(function (x) { return x.id; })).then(function () {});
      });
    });
    sb.from('behavior_logs').select('id,photo_path').lt('photo_expires_at', new Date().toISOString()).not('photo_path', 'is', null).then(function (r) {
      var rows = r.data || []; if (!rows.length) return;
      sb.storage.from('behavior').remove(rows.map(function (x) { return x.photo_path; })).then(function () {
        sb.from('behavior_logs').update({ photo_path: null }).in('id', rows.map(function (x) { return x.id; }));
      });
    });
  }
  function drawTabs() {
    var T = [['review', 'Журнал'], ['library', 'Материалын сан'], ['feedback', 'Санал хүсэлт' + (fbUnseen ? ' (' + fbUnseen + ')' : '')]];
    T.push(isOwner ? ['team', 'Багш нар'] : ['myfb', 'Санал өгөх']);
    tabsEl.hidden = false;
    tabsEl.innerHTML = T.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (t[0] === tab ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') +
      '<button data-t="out">Гарах</button>';
    tabsEl.querySelectorAll('button').forEach(function (b) {
      b.onclick = function () { if (b.dataset.t === 'out') { sb.auth.signOut().then(function () { showAuth(); }); return; } go(b.dataset.t); };
    });
  }
  var cView = 'att';
  function cTabs() {
    var V = [['att', 'Ирц, тэмдэглэл'], ['table', 'Үнэлгээ'], ['roster', 'Код, нэрс']];
    return '<div class="row"><button class="btn ghost" data-back="1">← Бүх анги</button>' + classes.map(function (c) { return '<button class="chip' + (c.id === curClass ? ' on' : '') + '" data-c="' + c.id + '">' + esc(c.name) + '</button>'; }).join('') + '</div>' +
      '<div class="row" style="gap:6px;border-bottom:1px solid #E1E4EE;padding-bottom:10px">' + V.map(function (v) { return '<button class="chip' + (cView === v[0] ? ' on' : '') + '" data-cv="' + v[0] + '">' + v[1] + '</button>'; }).join('') + '</div>';
  }
  function bindCTabs() {
    app.querySelectorAll('[data-cv]').forEach(function (b) { b.onclick = function () { cView = b.dataset.cv; showC(); }; });
    app.querySelectorAll('[data-back]').forEach(function (b) { b.onclick = function () { go('review'); }; });
    app.querySelectorAll('[data-c]').forEach(function (b) { b.onclick = function () { curClass = b.dataset.c; sel = null; showC(); }; });
  }
  function showC() { if (cView === 'att') showAttendance(); else if (cView === 'lesson') showLesson(); else if (cView === 'table') showJournal(); else showClasses(); }
  function openClassView(id, view) { curClass = id; cView = view || 'att'; tab = 'review'; drawTabs(); showC(); }
  function go(t) { tab = t; drawTabs(); ({ review: showReview, library: showLibrary, feedback: showFeedback, team: showTeam, myfb: showMyFeedback })[t](); countFb(); }
  function showMyFeedback() {
    var rating = 0;
    app.innerHTML = '<div class="card" style="max-width:640px"><h2>Платформын талаарх санал</h2><div class="muted">Таны санал платформыг сайжруулахад шууд ашиглагдана. Долоо хоногт нэг удаа бөглөхөд хангалттай.</div>' +
      '<label class="muted">1. Платформ ажилд тань хэр тус болж байна вэ?</label><div class="row" id="rt">' + [1, 2, 3, 4, 5].map(function (i) { return '<button class="btn ghost" data-rt="' + i + '" style="width:52px">' + i + '</button>'; }).join('') + '</div>' +
      '<label class="muted" for="hs">2. Долоо хоногт ойролцоогоор хэдэн цаг хэмнэсэн бэ?</label><input id="hs" type="number" min="0" max="100" step="0.5" placeholder="жишээ: 2">' +
      '<label class="muted" for="hp">3. Юу хамгийн их тус болсон бэ?</label><textarea id="hp"></textarea>' +
      '<label class="muted" for="ms">4. Юу дутуу байна, юуг засах вэ?</label><textarea id="ms"></textarea>' +

            var cs = Array.prototype.map.call(app.querySelectorAll('#pc .chip.on'), function (b) { return b.dataset.pc; });
            if (!cs.length) { toast('Дор хаяж нэг анги сонгоно уу'); return; }
            var days = +app.querySelector('#due .chip.on').dataset.d;
            var due = new Date(); due.setDate(due.getDate() + days - 1); due.setHours(23, 59, 0, 0);
            var rows = cs.map(function (c) { return { lesson_id: L.id, class_id: c, visible: true, tasks_open: q('#ot').classList.contains('on'), test_open: q('#oq').classList.contains('on'), due_at: due.toISOString(), opened_at: new Date().toISOString() }; });
            sb.from('lesson_access').upsert(rows).then(function (x) { if (!fail(x)) { toast(cs.length + ' анги руу илгээгдлээ'); libPanel = null; showLibrary(); } });
          };
        }
      }
    });
  }

  // ---------- CLASSES ----------
  function showClasses() {
    if (!classes.length) { go('review'); return; }
    if (!curClass) curClass = classes[0].id;
    app.innerHTML = cTabs() + '<div id="roster"><div class="muted">Ачаалж байна…</div></div>';
    bindCTabs();
    var cls = classes.filter(function (c) { return c.id === curClass; })[0];
    sb.from('students').select('*').eq('class_id', curClass).eq('active', true).order('code').then(function (r) {
      var kids = r.data || [];
      var link = STUDENT_URL + '?c=' + encodeURIComponent(cls.key || cls.name);
      var h = '<div class="card"><div class="row between"><h2>' + esc(cls.name) + ' · ' + kids.length + ' сурагч</h2><div class="row"><button class="btn green" id="cqr">Ангийн QR</button><button class="btn sec" id="xls1">Excel-ээр татах</button><button class="btn dark" id="print1">Кодын карт хэвлэх</button></div></div>' +
        '<div class="muted">Карт бүрийн QR тухайн хүүхдийн өөрийнх: уншуулахад шууд нэвтэрнэ. Карт алдагдвал "Шинэ тоо" дарахад хуучин QR ажиллахаа болино.</div><div class="muted">Ангийн линк: <a href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(link) + '</a></div></div>' +
        '<div class="card"><h3>Олноор нэмэх · журналаас</h3><div class="muted">Excel журналаасаа нэрсийн баганыг хуулаад (Cmd+C) энд буулгана (Cmd+V). Мөр бүр нэг сурагч.</div><textarea id="bulk" placeholder="Б.Тэмүүлэн\nГ.Номин"></textarea><button class="btn" id="addS">Нэмэх</button></div>' +
        '<div class="card"><div class="tablebox"><table><thead><tr><th>Нэр</th><th>Код</th><th>Тоо</th><th></th></tr></thead><tbody>' +
        kids.map(function (k) { return '<tr><td><b>' + esc(k.name) + '</b></td><td>' + esc(k.code) + '</td><td>' + esc(k.pin) + '</td><td style="text-align:right;white-space:nowrap"><button class="btn ghost" data-pin="' + k.id + '">Шинэ тоо</button> <button class="btn red" data-del="' + k.id + '" data-n="' + esc(k.name) + '">Хасах</button></td></tr>'; }).join('') +
        '</tbody></table></div></div>';
      document.getElementById('roster').innerHTML = h;
      q('#addS').onclick = function () {
        var names = q('#bulk').value.split('\n').map(function (l) { return l.split('\t')[0].trim(); }).filter(Boolean);
        if (!names.length) { toast('Нэрсээ буулгана уу'); return; }
        sb.rpc('add_students', { p_class_id: curClass, p_names: names }).then(function (x) { if (!fail(x)) { toast(x.data + ' сурагч нэмэгдлээ'); showClasses(); } });
      };
      app.querySelectorAll('[data-pin]').forEach(function (b) { b.onclick = function () { sb.rpc('reset_pin', { p_student: b.dataset.pin }).then(function (x) { if (!fail(x)) { toast('Шинэ тоо: ' + x.data); showClasses(); } }); }; });
      app.querySelectorAll('[data-del]').forEach(function (b) {
        b.onclick = function () {
          if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Тийм, хас'; b.style.background = '#A12A1E'; b.style.color = '#fff'; toast(b.dataset.n + '-г хасах бол дахин дарна уу. Өмнөх дүн архивт үлдэнэ.'); return; }
          sb.from('students').update({ active: false }).eq('id', b.dataset.del).then(function (x) { if (!fail(x)) showClasses(); });
        };
      });
      q('#cqr').onclick = function () { showClassQR(cls); };
      q('#xls1').onclick = function () {
        var lines = [['№', 'Нэр', 'Код', '4 оронтой тоо', 'Анги', 'Шууд нэвтрэх линк (QR-тэй ижил)']].concat(kids.map(function (k, i) { return [i + 1, k.name, k.code, k.pin, cls.name, link + '&s=' + encodeURIComponent(k.code) + '&p=' + k.pin]; }));
        var csv = '\ufeff' + lines.map(function (l) { return l.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
        var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = cls.name + '-кодууд.csv'; a.click();
        toast('Татагдлаа · Excel-ээр нээгдэнэ');
      };
      q('#print1').onclick = function () {
        var p = document.getElementById('print');
        p.innerHTML = '<div class="cards">' + kids.map(function (k) {
          var qr = qrcode(0, 'M'); qr.addData(link + '&s=' + encodeURIComponent(k.code) + '&p=' + k.pin); qr.make();
          return '<div class="pc"><div style="flex:1"><b>' + esc(k.name) + '</b><div>' + esc(cls.name) + ' · ' + esc(T.subject) + '</div><div>Код: <b>' + esc(k.code) + '</b></div><div>Тоо: <b>' + esc(k.pin) + '</b></div></div>' + qr.createSvgTag(3, 0) + '</div>';
        }).join('') + '</div>';
        setTimeout(function () { window.print(); }, 100);
      };
    });
  }

  sb.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_OUT') showAuth(); });
  boot();
})();
</script>
