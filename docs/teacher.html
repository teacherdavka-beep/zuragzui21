<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Багшийн хэсэг · Зураг зүй</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F6FA;font-family:Inter,system-ui,sans-serif;color:#1A1F36}
button,input,select,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer}
header{background:#1E2A5A;color:#fff;padding:16px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header .sub{font-size:13px;color:#C9D1F0}
header h1{margin:2px 0 0;font-size:22px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{height:42px;padding:0 16px;border-radius:99px;border:1.5px solid #fff;background:transparent;color:#fff;font-weight:600}
nav.tabs button.on{background:#fff;color:#1E2A5A}
main{max-width:1200px;margin:0 auto;padding:20px 24px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid #E1E4EE;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
h2{margin:0;font-size:18px}h3{margin:0;font-size:16px}
.muted{color:#5A6178;font-size:13px;line-height:1.5}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=number],select,textarea{height:44px;border:1px solid #C5CADB;border-radius:10px;padding:0 12px;background:#fff;color:#1A1F36}
textarea{height:auto;min-height:120px;padding:10px 12px;resize:vertical;width:100%}
.btn{height:44px;padding:0 16px;border:0;border-radius:10px;background:#2747B8;color:#fff;font-weight:600}
.btn.sec{background:#fff;color:#2747B8;border:1.5px solid #2747B8}
.btn.ghost{background:#fff;color:#1A1F36;border:1px solid #C5CADB}
.btn.green{background:#1C7C4A}.btn.amber{background:#fff;color:#8A4B0B;border:1px solid #F2C89A}.btn.red{background:#fff;color:#A12A1E;border:1px solid #E9B4AE}
.btn.dark{background:#1E2A5A}
.btn:disabled{opacity:.5}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid #C5CADB;background:#fff;font-weight:600;color:#1A1F36}
.chip.on{background:#1E2A5A;border-color:#1E2A5A;color:#fff}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px}
.p-red{background:#FDECEA;color:#A12A1E}.p-green{background:#E3F4EA;color:#1C6B40}.p-blue{background:#EEF1FA;color:#2747B8}.p-amber{background:#FFF3E5;color:#8A4B0B}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.photos img{width:100%;height:150px;object-fit:cover;border-radius:8px;border:1px solid #C5CADB;cursor:zoom-in}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #EEF0F5}
th{font-size:12px;color:#5A6178}
.tablebox{overflow-x:auto}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.names button{min-height:54px;text-align:left;border-radius:10px;border:1.5px solid #D5DAE8;background:#fff;padding:8px 10px;position:relative;color:#1A1F36}
.names button.on{background:#2747B8;color:#fff;border-color:#2747B8}
.badge{position:absolute;top:6px;right:6px;background:#C2410C;color:#fff;border-radius:99px;font-size:11px;min-width:20px;height:20px;line-height:20px;text-align:center}
.sticky{position:sticky;bottom:0;background:#fff;border-top:2px solid #2747B8;padding:12px;border-radius:12px 12px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.06)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1A1F36;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:20}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:30}
.zoom img{max-width:96vw;max-height:94vh}
#print{display:none}
@media print{
  body{background:#fff} header,main,.toast{display:none!important}
  #print{display:block}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .pc{border:1px dashed #888;padding:12px;display:flex;gap:10px;align-items:center;break-inside:avoid;height:46mm}
  .pc b{font-size:15px}.pc div{font-size:13px}
}
</style>
</head>
<body>
<header>
  <div><div class="sub" id="who">Багшийн хэсэг</div><h1>Зураг зүй · Г.Даваасүрэн багшийн самбар</h1></div>
  <nav class="tabs" id="tabs" hidden></nav>
</header>
<main id="app"><div class="muted">Ачаалж байна…</div></main>
<div id="print"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script>
(function () {
  var C = window.APP_CONFIG;
  var sb = window.supabase.createClient(C.url, C.key);
  var app = document.getElementById('app'), tabsEl = document.getElementById('tabs');
  var me = null, classes = [], tab = 'review';
  var KIND = { phone: 'Утас', sleep: 'Унтсан', late: 'Хоцорсон', disrupt: 'Саад' };
  var STUDENT_URL = new URL('index.html', location.href).href;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3000); }
  function fmt(d) { var x = new Date(d); return (x.getMonth() + 1) + '/' + x.getDate() + ' ' + String(x.getHours()).padStart(2, '0') + ':' + String(x.getMinutes()).padStart(2, '0'); }
  function q(sel) { return app.querySelector(sel); }
  function fail(r) { if (r && r.error) { toast('Алдаа: ' + r.error.message); console.error(r.error); return true; } return false; }

  // ---------- AUTH ----------
  function showAuth(msg) {
    tabsEl.hidden = true;
    app.innerHTML = '<div class="card" style="max-width:420px;margin:30px auto"><h2>Багшаар нэвтрэх</h2>' +
      '<label class="muted" for="em">Имэйл</label><input id="em" type="email" autocomplete="email">' +
      '<label class="muted" for="pw">Нууц үг (8+ тэмдэгт)</label><div class="row" style="flex-wrap:nowrap"><input id="pw" type="password" autocomplete="current-password" style="flex:1;min-width:0"><button class="btn ghost" id="eye" type="button" aria-pressed="false">Харах</button></div>' +
      '<div class="muted" id="msg" style="color:#B42318">' + esc(msg || '') + '</div>' +
      '<button class="btn" id="in">Нэвтрэх</button><button class="btn ghost" id="up">Анх удаа: бүртгүүлэх</button>' +
      '<div class="muted">Анх бүртгүүлсэн хүн л багш болно. Бусад хүн бүртгүүлсэн ч юу ч харахгүй.</div></div>';
    q('#eye').onclick = function () { var p = q('#pw'), show = p.type === 'password'; p.type = show ? 'text' : 'password'; this.textContent = show ? 'Нуух' : 'Харах'; this.setAttribute('aria-pressed', show); };
    q('#in').onclick = function () {
      sb.auth.signInWithPassword({ email: q('#em').value.trim(), password: q('#pw').value }).then(function (r) {
        if (r.error) q('#msg').textContent = 'Нэвтэрч чадсангүй: имэйл, нууц үгээ шалгана уу.'; else boot();
      });
    };
    q('#up').onclick = function () {
      var pw = q('#pw').value; if (pw.length < 8) { q('#msg').textContent = 'Нууц үг 8+ тэмдэгт байх ёстой.'; return; }
      sb.auth.signUp({ email: q('#em').value.trim(), password: pw, options: { emailRedirectTo: location.href } }).then(function (r) {
        if (r.error) q('#msg').textContent = r.error.message;
        else if (!r.data.session) q('#msg').textContent = 'Имэйл рүү тань баталгаажуулах линк явууллаа. Линк дээр дараад энд буцаж нэвтэрнэ үү.';
        else boot();
      });
    };
  }

  function boot() {
    sb.auth.getSession().then(function (r) {
      var s = r.data.session; if (!s) { showAuth(); return; }
      sb.rpc('claim_teacher', { p_name: 'Г.Даваасүрэн' }).then(function (c) {
        if (c.data !== true) { app.innerHTML = '<div class="card">Энэ бүртгэл багшийн эрхгүй байна.</div>'; return; }
        me = s.user; document.getElementById('who').textContent = me.email;
        cleanupPhotos();
        loadClasses().then(function () { drawTabs(); go(classes.length ? 'review' : 'classes'); });
      });
    });
  }
  function loadClasses() { return sb.from('classes').select('*').order('name').then(function (r) { classes = r.data || []; }); }
  function cleanupPhotos() {
    sb.from('behavior_logs').select('id,photo_path').lt('photo_expires_at', new Date().toISOString()).not('photo_path', 'is', null).then(function (r) {
      var rows = r.data || []; if (!rows.length) return;
      sb.storage.from('behavior').remove(rows.map(function (x) { return x.photo_path; })).then(function () {
        sb.from('behavior_logs').update({ photo_path: null }).in('id', rows.map(function (x) { return x.id; }));
      });
    });
  }
  function drawTabs() {
    var T = [['review', 'Самбар'], ['journal', 'Журнал'], ['library', 'Материалын сан'], ['classes', 'Анги']];
    tabsEl.hidden = false;
    tabsEl.innerHTML = T.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (t[0] === tab ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') +
      '<button data-t="out">Гарах</button>';
    tabsEl.querySelectorAll('button').forEach(function (b) {
      b.onclick = function () { if (b.dataset.t === 'out') { sb.auth.signOut().then(function () { showAuth(); }); return; } go(b.dataset.t); };
    });
  }
  var jView = 'lesson';
  function jTabs() { return '<div class="row" style="gap:6px"><button class="chip' + (jView === 'lesson' ? ' on' : '') + '" data-jv="lesson">Хичээл дээр бүртгэх</button><button class="chip' + (jView === 'table' ? ' on' : '') + '" data-jv="table">Дүн, тайлан</button></div>'; }
  function bindJTabs() { app.querySelectorAll('[data-jv]').forEach(function (b) { b.onclick = function () { jView = b.dataset.jv; showJ(); }; }); }
  function showJ() { if (jView === 'lesson') showLesson(); else showJournal(); }
  function go(t) { tab = t; drawTabs(); ({ review: showReview, journal: showJ, library: showLibrary, classes: showClasses })[t](); }
  function classPicker(cur, cb) {
    return '<div class="row">' + classes.map(function (c) { return '<button class="chip' + (c.id === cur ? ' on' : '') + '" data-c="' + c.id + '">' + esc(c.name) + '</button>'; }).join('') + '</div>';
  }
  function bindClassPicker(cb) { app.querySelectorAll('[data-c]').forEach(function (b) { b.onclick = function () { cb(b.dataset.c); }; }); }
  var curClass = null;
  function needClass() { if (!classes.length) { app.innerHTML = '<div class="card"><h2>Эхлээд анги үүсгэнэ үү</h2><button class="btn" id="g">Анги цонх руу</button></div>'; q('#g').onclick = function () { go('classes'); }; return true; } if (!curClass) curClass = classes[0].id; return false; }

  function showClassQR(cls) {
    var link = STUDENT_URL + '?c=' + encodeURIComponent(cls.name);
    var qr = qrcode(0, 'M'); qr.addData(link); qr.make();
        var z = document.createElement('div'); z.className = 'zoom'; z.style.flexDirection = 'column'; z.style.gap = '14px';
        z.innerHTML = '<div style="background:#fff;border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:92vw">' +
          '<b style="font-size:24px">' + esc(cls.name) + ' анги · ' + esc(C.subject) + '</b><div class="muted">Утасны камераар уншуулаад кодоо сонгоно</div>' +
          '<div id="qrbox" style="width:min(70vw,420px)">' + qr.createSvgTag({ cellSize: 10, margin: 2, scalable: true }) + '</div>' +
          '<div class="muted" style="word-break:break-all;text-align:center">' + esc(link) + '</div>' +
          '<div class="row"><button class="btn" id="qcopy">Линк хуулах</button><button class="btn sec" id="qdl">Зураг татах</button><button class="btn ghost" id="qx">Хаах</button></div></div>';
        document.body.appendChild(z);
        z.onclick = function (e) { if (e.target === z) z.remove(); };
        z.querySelector('#qx').onclick = function () { z.remove(); };
        z.querySelector('#qcopy').onclick = function () {
          (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(function () { toast('Линк хуулагдлаа · группт буулгана'); }, function () { toast('Линкийг гараар хуулна уу'); });
        };
        z.querySelector('#qdl').onclick = function () {
          var a = document.createElement('a'); a.href = qr.createDataURL(12, 4); a.download = cls.name + '-ангийн-QR.gif'; a.click();
        };
  }
  // ---------- BOARD (padlet-like) ----------
  var boardLesson = null, openMiss = {};
  function showReview() {
    app.innerHTML = '<div class="muted">Ачаалж байна…</div>';
    Promise.all([
      sb.from('lesson_access').select('lesson_id,class_id,opened_at,due_at,lessons(title,num)').order('opened_at', { ascending: false }),
      sb.from('students').select('id,name,code,class_id').eq('active', true).order('code')
    ]).then(function (r0) {
      var acc = r0[0].data || [], kids = r0[1].data || [];
      var lessonsMap = {}, order = [];
      acc.forEach(function (a) { if (!lessonsMap[a.lesson_id]) { lessonsMap[a.lesson_id] = a.lessons; order.push(a.lesson_id); } });
      if (!boardLesson || !lessonsMap[boardLesson]) boardLesson = order[0] || null;
      var subsQ = boardLesson ? sb.from('submissions').select('id,status,reason,photo_paths,created_at,student_id').eq('lesson_id', boardLesson).order('created_at', { ascending: false }) : Promise.resolve({ data: [] });
      Promise.all([subsQ, sb.from('submissions').select('id', { count: 'exact', head: true }).eq('status', 'review')]).then(function (r1) {
        var subs = r1[0].data || [], pendingAll = r1[1].count || 0;
        var latest = {}; subs.forEach(function (s) { if (!latest[s.student_id]) latest[s.student_id] = s; });
        var html = '<div class="row between"><h2>Даалгаврын самбар</h2><span class="pill p-amber">Танд шалгах (бүх сэдэв): ' + pendingAll + '</span></div>';
        html += order.length ? '<div class="row">' + order.map(function (id) { var l = lessonsMap[id]; return '<button class="chip' + (id === boardLesson ? ' on' : '') + '" data-bl="' + id + '">' + esc(l.title) + '</button>'; }).join('') + '</div>'
          : '<div class="muted">Одоогоор ямар ч ангид сэдэв нээгээгүй байна. Материалын сангаас "Ангид илгээх" дарна. Ангиуд доор харагдаж байгаа, QR-ээ авч болно.</div>';
        html += '<div style="overflow-x:auto;padding-bottom:12px"><div style="display:flex;gap:14px;align-items:flex-start;width:max-content">';
        classes.forEach(function (c) {
          var ck = kids.filter(function (k) { return k.class_id === c.id; });
          var opened = acc.some(function (a) { return a.class_id === c.id && a.lesson_id === boardLesson; });
          var sent = ck.filter(function (k) { return latest[k.id]; });
          var missing = ck.filter(function (k) { return !latest[k.id]; });
          var review = sent.filter(function (k) { return latest[k.id].status === 'review'; });
          var done = sent.filter(function (k) { return latest[k.id].status !== 'review'; });
          html += '<div style="width:300px;display:flex;flex-direction:column;gap:10px">' +
            '<div style="background:#1E2A5A;color:#fff;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;position:relative">' +
            '<div class="row between" style="flex-wrap:nowrap"><b style="font-size:18px">' + esc(c.name) + ' анги</b>' +
            '<button aria-label="' + esc(c.name) + ' ангийн цэс" data-menu="' + c.id + '" style="background:transparent;border:0;color:#fff;font-size:22px;min-width:44px;min-height:40px;cursor:pointer">⋮</button></div>' +
            '<div style="font-size:13px;color:#C9D1F0">' + (opened ? sent.length + ' / ' + ck.length + ' илгээсэн' : (boardLesson ? 'Энэ сэдэв нээгдээгүй' : ck.length + ' сурагч')) + '</div>' +
            (opened ? '<div style="height:6px;border-radius:99px;background:#2E3D78"><div style="height:6px;border-radius:99px;background:#7FB2FF;width:' + (ck.length ? Math.round(sent.length / ck.length * 100) : 0) + '%"></div></div>' : '') +
            '<div data-menubox="' + c.id + '" hidden style="position:absolute;right:8px;top:48px;background:#fff;color:#1A1F36;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;z-index:5;width:220px">' +
            '<button class="btn ghost" style="width:100%;border:0;text-align:left" data-cq="' + c.id + '">Ангийн QR харах</button>' +
            '<button class="btn ghost" style="width:100%;border:0;text-align:left" data-cl="' + c.id + '">Ангийн линк хуулах</button>' +
            '<button class="btn ghost" style="width:100%;border:0;text-align:left" data-cr="' + c.id + '">Нэрс, кодууд</button></div></div>';
          if (opened) {
            html += '<div style="background:#E3F4EA;border-radius:10px;padding:8px 12px" class="row between"><span style="font-size:13px;font-weight:600;color:#1C6B40">Журналд орсон</span><b style="color:#1C6B40">' + done.length + '</b></div>';
            html += '<button class="btn amber" style="text-align:left" data-miss="' + c.id + '">' + missing.length + ' сурагч илгээгээгүй ' + (openMiss[c.id] ? '▲' : '▼') + '</button>';
            if (openMiss[c.id]) html += '<div class="card" style="padding:10px;font-size:13px;line-height:1.6">' + (missing.map(function (k) { return esc(k.name); }).join(', ') || 'Бүгд илгээсэн') + '</div>';
            review.forEach(function (k) {
              var s = latest[k.id];
              var R = { noplus: ['Багшид үзүүлээгүй · нөхсөн', 'p-blue', '+ Батлах', 'Дахин хийх'], dup: ['Ижил зураг илэрсэн', 'p-red', 'Зөв', 'Хуулбар'], spot: ['Санамсаргүй шалгалт', 'p-amber', 'Зөв байна', 'Худал'], flagged: ['Өмнө худал бичсэн', 'p-red', 'Зөв байна', 'Худал'] }[s.reason] || ['Шалгах', 'p-blue', '+ Батлах', 'Дахин хийх'];
              html += '<div class="card" data-id="' + s.id + '"><span class="pill ' + R[1] + '" style="align-self:flex-start">' + R[0] + '</span><b>' + esc(k.name) + '</b><div class="muted">' + fmt(s.created_at) + '</div>' +
                '<div class="photos" data-p="' + esc(JSON.stringify(s.photo_paths)) + '"></div>' +
                '<div class="row"><button class="btn green" data-ok="' + s.id + '">' + R[2] + '</button><button class="btn amber" data-bad="' + s.id + '" data-r="' + s.reason + '" data-st="' + k.id + '">' + R[3] + '</button></div></div>';
            });
            done.forEach(function (k) {
              var s = latest[k.id];
              var lab = s.status === 'redo' ? ['Дахин хийх', 'p-amber'] : (s.status === 'fake' ? ['Худал', 'p-red'] : ['+ Журналд', 'p-green']);
              html += '<div class="card" style="padding:10px 12px;gap:6px"><div class="row between"><b style="font-size:14px">' + esc(k.name) + '</b><span class="pill ' + lab[1] + '">' + lab[0] + '</span></div>' +
                '<button class="btn ghost" style="height:34px" data-view="' + esc(JSON.stringify(s.photo_paths)) + '">Зураг харах</button></div>';
            });
          }
          html += '</div>';
        });
        html += '</div></div>';
        app.innerHTML = html;
        app.querySelectorAll('[data-bl]').forEach(function (b) { b.onclick = function () { boardLesson = b.dataset.bl; showReview(); }; });
        app.querySelectorAll('[data-miss]').forEach(function (b) { b.onclick = function () { openMiss[b.dataset.miss] = !openMiss[b.dataset.miss]; showReview(); }; });
        app.querySelectorAll('[data-menu]').forEach(function (b) {
          b.onclick = function (e) { e.stopPropagation(); var m = app.querySelector('[data-menubox="' + b.dataset.menu + '"]'); var was = m.hidden; app.querySelectorAll('[data-menubox]').forEach(function (x) { x.hidden = true; }); m.hidden = !was; };
        });
        app.onclick = function (e) { if (!e.target.closest('[data-menubox]')) app.querySelectorAll('[data-menubox]').forEach(function (x) { x.hidden = true; }); };
        function clsById(id) { return classes.filter(function (c) { return c.id === id; })[0]; }
        app.querySelectorAll('[data-cq]').forEach(function (b) { b.onclick = function () { showClassQR(clsById(b.dataset.cq)); }; });
        app.querySelectorAll('[data-cl]').forEach(function (b) {

          '<div class="muted">1. Аль анги руу</div><div class="row"><button class="btn green" id="allg" type="button">Бүх ' + libGrade + '-р анги</button></div><div class="row" id="pc">' + classes.map(function (c) { var on = a2.some(function (x) { return x.class_id === c.id; }); return '<button class="chip' + (on ? ' on' : '') + '" data-pc="' + c.id + '">' + esc(c.name) + '</button>'; }).join('') + '</div>' +
          '<div class="muted">2. Юуг нээх (видео, зураг илгээх нь үргэлж нээлттэй)</div><div class="row"><button class="chip on" id="ot">Дасгал, даалгавар</button><button class="chip on" id="oq">Тест</button></div>' +
          '<div class="muted">3. Хугацаа</div><div class="row" id="due"><button class="chip" data-d="1">Өнөөдөр</button><button class="chip on" data-d="3">3 хоног</button><button class="chip" data-d="7">1 долоо хоног</button></div>' +
          '<button class="btn green" id="send">Сонгосон анги руу илгээх</button></div>';
      }
      app.innerHTML = html;
      app.querySelectorAll('[data-g]').forEach(function (b) { b.onclick = function () { libGrade = +b.dataset.g; openLesson = null; showLibrary(); }; });
      bindFiles(files);
      q('#addU').onclick = function () {
        var n = q('#un').value.trim(); if (!n) { toast('Нэгжийн нэрээ бичнэ үү'); return; }
        sb.from('units').insert({ teacher_id: me.id, grade: libGrade, name: n, sort: units.length + 1 }).then(function (r) { if (!fail(r)) showLibrary(); });
      };
      app.querySelectorAll('[data-addl]').forEach(function (b) {
        b.onclick = function () {
          var inp = app.querySelector('[data-lt="' + b.dataset.addl + '"]'); var t = inp.value.trim();
          if (!t) { toast('Гарчгаа бичнэ үү'); inp.focus(); return; }
          sb.from('lessons').insert({ unit_id: b.dataset.addl, num: +b.dataset.n, title: t }).select().then(function (r) { if (fail(r)) return; openLesson = r.data[0].id; showLibrary(); });
        };
      });
      app.querySelectorAll('[data-l]').forEach(function (b) { b.onclick = function () { openLesson = b.dataset.l; showLibrary(); setTimeout(function () { var e = q('#ed'); if (e) e.scrollIntoView({ behavior: 'smooth' }); }, 50); }; });
      if (L) {
        q('#close').onclick = function () { openLesson = null; showLibrary(); };
        q('#save').onclick = function () {
          var test = parseTest(q('#lq').value);
          sb.from('lessons').update({ title: q('#lt').value.trim() || L.title, video_url: q('#lv').value.trim() || null, exercise_url: q('#lx').value.trim() || null, test: test }).eq('id', L.id)
            .then(function (r) { if (!fail(r)) { toast('Хадгалагдлаа · тест ' + test.length + ' асуулт'); showLibrary(); } });
        };
        app.querySelectorAll('#pc .chip, #ot, #oq').forEach(function (b) { b.onclick = function () { b.classList.toggle('on'); }; });
        q('#allg').onclick = function () { app.querySelectorAll('#pc .chip').forEach(function (x) { var c = classes.filter(function (k) { return k.id === x.dataset.pc; })[0]; x.classList.toggle('on', !!c && c.grade === libGrade); }); toast('Бүх ' + libGrade + '-р анги сонгогдлоо'); };
        app.querySelectorAll('#due .chip').forEach(function (b) { b.onclick = function () { app.querySelectorAll('#due .chip').forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
        q('#send').onclick = function () {
          var cs = Array.prototype.map.call(app.querySelectorAll('#pc .chip.on'), function (b) { return b.dataset.pc; });
          if (!cs.length) { toast('Дор хаяж нэг анги сонгоно уу'); return; }
          var days = +app.querySelector('#due .chip.on').dataset.d;
          var due = new Date(); due.setDate(due.getDate() + days - 1); due.setHours(23, 59, 0, 0);
          var rows = cs.map(function (c) { return { lesson_id: L.id, class_id: c, visible: true, tasks_open: q('#ot').classList.contains('on'), test_open: q('#oq').classList.contains('on'), due_at: due.toISOString(), opened_at: new Date().toISOString() }; });
          sb.from('lesson_access').upsert(rows).then(function (r) { if (!fail(r)) { toast(cs.length + ' анги руу илгээгдлээ'); showLibrary(); } });
        };
      }
    });
  }

  // ---------- CLASSES ----------
  function showClasses() {
    var letters = ['а', 'б', 'в', 'г', 'д', 'е', 'ё', 'ж', 'з', 'и'];
    var html = '<div class="card"><h2>Шинэ анги</h2><div class="row">' +
      '<label class="muted" for="cg">Анги</label><select id="cg"><option value="10">10</option><option value="11">11</option><option value="12" selected>12</option></select>' +
      '<label class="muted" for="cb">Бүлэг</label><select id="cb">' + letters.map(function (l) { return '<option>' + l + '</option>'; }).join('') + '</select>' +
      '<button class="btn" id="addC">Нэмэх</button><span class="muted" id="cprev"></span></div></div>';
    if (classes.length) { if (!curClass) curClass = classes[0].id; html += classPicker(curClass) + '<div id="roster"><div class="muted">Ачаалж байна…</div></div>'; }
    app.innerHTML = html;
    var prev = function () { q('#cprev').textContent = '→ ' + q('#cg').value + q('#cb').value + ' анги'; };
    q('#cg').onchange = prev; q('#cb').onchange = prev; prev();
    q('#addC').onclick = function () {
      var n = q('#cg').value + q('#cb').value;
      if (classes.some(function (c) { return c.name === n; })) { toast(n + ' анги аль хэдийн байна'); return; }
      sb.from('classes').insert({ teacher_id: me.id, name: n, grade: +q('#cg').value }).select().then(function (r) { if (fail(r)) return; curClass = r.data[0].id; toast(n + ' анги нэмэгдлээ'); loadClasses().then(showClasses); });
    };
    if (!classes.length) return;
    bindClassPicker(function (c) { curClass = c; showClasses(); });
    var cls = classes.filter(function (c) { return c.id === curClass; })[0];
    sb.from('students').select('*').eq('class_id', curClass).eq('active', true).order('code').then(function (r) {
      var kids = r.data || [];
      var link = STUDENT_URL + '?c=' + encodeURIComponent(cls.name);
      var h = '<div class="card"><div class="row between"><h2>' + esc(cls.name) + ' · ' + kids.length + ' сурагч</h2><div class="row"><button class="btn green" id="cqr">Ангийн QR</button><button class="btn sec" id="xls1">Excel-ээр татах</button><button class="btn dark" id="print1">Кодын карт хэвлэх</button></div></div>' +
        '<div class="muted">Карт бүрийн QR тухайн хүүхдийн өөрийнх: уншуулахад шууд нэвтэрнэ. Карт алдагдвал "Шинэ тоо" дарахад хуучин QR ажиллахаа болино.</div><div class="muted">Ангийн линк: <a href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(link) + '</a></div></div>' +
        '<div class="card"><h3>Олноор нэмэх · журналаас</h3><div class="muted">Excel журналаасаа нэрсийн баганыг хуулаад (Cmd+C) энд буулгана (Cmd+V). Мөр бүр нэг сурагч.</div><textarea id="bulk" placeholder="Б.Тэмүүлэн\nГ.Номин"></textarea><button class="btn" id="addS">Нэмэх</button></div>' +
        '<div class="card"><div class="tablebox"><table><thead><tr><th>Нэр</th><th>Код</th><th>Тоо</th><th></th></tr></thead><tbody>' +
        kids.map(function (k) { return '<tr><td><b>' + esc(k.name) + '</b></td><td>' + esc(k.code) + '</td><td>' + esc(k.pin) + '</td><td style="text-align:right;white-space:nowrap"><button class="btn ghost" data-pin="' + k.id + '">Шинэ тоо</button> <button class="btn red" data-del="' + k.id + '" data-n="' + esc(k.name) + '">Хасах</button></td></tr>'; }).join('') +
        '</tbody></table></div></div>';
      document.getElementById('roster').innerHTML = h;
      q('#addS').onclick = function () {
        var names = q('#bulk').value.split('\n').map(function (l) { return l.split('\t')[0].trim(); }).filter(Boolean);
        if (!names.length) { toast('Нэрсээ буулгана уу'); return; }
        sb.rpc('add_students', { p_class_id: curClass, p_names: names }).then(function (x) { if (!fail(x)) { toast(x.data + ' сурагч нэмэгдлээ'); showClasses(); } });
      };
      app.querySelectorAll('[data-pin]').forEach(function (b) { b.onclick = function () { sb.rpc('reset_pin', { p_student: b.dataset.pin }).then(function (x) { if (!fail(x)) { toast('Шинэ тоо: ' + x.data); showClasses(); } }); }; });
      app.querySelectorAll('[data-del]').forEach(function (b) {
        b.onclick = function () {
          if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Тийм, хас'; b.style.background = '#A12A1E'; b.style.color = '#fff'; toast(b.dataset.n + '-г хасах бол дахин дарна уу. Өмнөх дүн архивт үлдэнэ.'); return; }
          sb.from('students').update({ active: false }).eq('id', b.dataset.del).then(function (x) { if (!fail(x)) showClasses(); });
        };
      });
      q('#cqr').onclick = function () { showClassQR(cls); };
      q('#xls1').onclick = function () {
        var lines = [['№', 'Нэр', 'Код', '4 оронтой тоо', 'Анги', 'Шууд нэвтрэх линк (QR-тэй ижил)']].concat(kids.map(function (k, i) { return [i + 1, k.name, k.code, k.pin, cls.name, link + '&s=' + encodeURIComponent(k.code) + '&p=' + k.pin]; }));
        var csv = '\ufeff' + lines.map(function (l) { return l.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
        var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = cls.name + '-кодууд.csv'; a.click();
        toast('Татагдлаа · Excel-ээр нээгдэнэ');
      };
      q('#print1').onclick = function () {
        var p = document.getElementById('print');
        p.innerHTML = '<div class="cards">' + kids.map(function (k) {
          var qr = qrcode(0, 'M'); qr.addData(link + '&s=' + encodeURIComponent(k.code) + '&p=' + k.pin); qr.make();
          return '<div class="pc"><div style="flex:1"><b>' + esc(k.name) + '</b><div>' + esc(cls.name) + ' · ' + esc(C.subject) + '</div><div>Код: <b>' + esc(k.code) + '</b></div><div>Тоо: <b>' + esc(k.pin) + '</b></div></div>' + qr.createSvgTag(3, 0) + '</div>';
        }).join('') + '</div>';
        setTimeout(function () { window.print(); }, 100);
      };
    });
  }

  sb.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_OUT') showAuth(); });
  boot();
})();
</script>
</body>
</html>
